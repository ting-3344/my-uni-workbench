<title>我的大学工作台</title>
<style>
/* ============ Neo-minimalism · 基础变量（粉紫 → 深蓝） ============ */
:root{
  --bg:#F5EDFB;
  --bg2:rgba(255,255,255,.52);
  --card:rgba(255,255,255,.68);
  --card-solid:#FFFFFF;
  --iris:#7C5CD6;
  --iris-d:#5B3FA8;
  --iris-s:rgba(124,92,214,.13);
  --iris-l:rgba(255,255,255,.72);
  --ink:#262B4D;
  --ink2:#5A5F85;
  --ink3:#8C90AF;
  --line:rgba(90,70,160,.20);
  --line2:rgba(90,70,160,.11);
  --sh:0 12px 34px rgba(38,43,77,.10);
  --sh2:0 4px 14px rgba(38,43,77,.07);
  --sh-in:inset 0 2px 6px rgba(38,43,77,.07);
  --serif:"Songti SC","STSong","SimSun","Times New Roman",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","helvetica neue",sans-serif;
  --r:24px;
  --r2:18px;
  --ok:#3FA98A;
  --warn:#E0A33F;
  --danger:#E4556E;
  --blue:#4E86E8;
  /* 旧类名兼容映射：全部指向新主色 */
  --gold:var(--iris);
  --gold-d:var(--iris-d);
  --gold-s:var(--iris-s);
  --gold-l:var(--iris-l);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(115% 78% at 4% -8%,rgba(255,208,236,.92) 0%,rgba(255,208,236,0) 58%),
    radial-gradient(95% 66% at 100% 2%,rgba(212,198,252,.88) 0%,rgba(212,198,252,0) 62%),
    radial-gradient(120% 88% at 18% 112%,rgba(63,80,178,.70) 0%,rgba(63,80,178,0) 66%),
    linear-gradient(168deg,#FEF5FB 0%,#F6EDFC 24%,#E9EEFD 50%,#B7C2F0 74%,#46539B 100%);
  background-attachment:fixed;background-repeat:no-repeat;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.5px;margin:0}
h1{font-size:23px}
h2{font-size:18px}
h3{font-size:15.5px}
p{margin:0}
a{color:var(--iris-d);text-decoration:none}
a:hover{text-decoration:underline}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(124,92,214,.30);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex:0 0 248px;position:fixed;top:0;left:0;bottom:0;
  background:linear-gradient(180deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.62) 100%);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border-right:1px solid rgba(255,255,255,.7);
  padding:20px 14px 16px;display:flex;flex-direction:column;gap:14px;z-index:60;
  box-shadow:6px 0 30px rgba(38,43,77,.10);
  transition:width .28s cubic-bezier(.3,.8,.3,1),transform .32s cubic-bezier(.3,.8,.3,1),padding .28s;
}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column;transition:margin-left .28s cubic-bezier(.3,.8,.3,1)}
.view{padding:22px 30px 60px;max-width:1180px;width:100%}

/* 侧栏收起态（桌面 / 平板） */
body.sb-min .sidebar{width:78px;flex:0 0 78px;padding:18px 10px}
body.sb-min .main{margin-left:78px}
body.sb-min .brand{justify-content:center;padding:0}
body.sb-min .brand-txt,body.sb-min .nav-label,body.sb-min .nav-txt,body.sb-min .adm-txt,body.sb-min .mini-row{display:none}
body.sb-min .nav-item{justify-content:center;padding:10px 0}
body.sb-min .side-foot .btn{justify-content:center}
body.sb-min .sb-toggle .tg{transform:rotate(180deg)}

.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 0}
.brand-mark{
  width:42px;height:42px;border-radius:14px;flex:0 0 42px;display:grid;place-items:center;
  background:linear-gradient(145deg,#F3EBFF,#E4DAFB);border:1px solid rgba(124,92,214,.22);
  box-shadow:var(--sh2);font-size:20px;
}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt strong{font-family:var(--serif);font-size:16px;letter-spacing:.6px;white-space:nowrap}
.brand-txt span{font-size:11.5px;color:var(--ink3);white-space:nowrap}

.nav{display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;padding-right:2px}
.nav-label{font-size:11px;color:var(--ink3);letter-spacing:1.5px;padding:6px 10px 2px;font-family:var(--serif)}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:14px;
  cursor:pointer;color:var(--ink2);border:1px solid transparent;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease,transform .18s cubic-bezier(.3,.8,.3,1);
  white-space:nowrap;font-size:13.8px;
}
.nav-item:hover{background:rgba(255,255,255,.92);color:var(--ink);box-shadow:var(--sh2);transform:translateX(2px)}
.nav-item:active{transform:scale(.98)}
.nav-item.on{
  background:linear-gradient(120deg,rgba(124,92,214,.16),rgba(78,134,232,.10));
  color:var(--iris-d);border-color:rgba(124,92,214,.30);
  box-shadow:var(--sh2);font-weight:600;
}
.nav-item.on .nav-ico{background:rgba(255,255,255,.9)}
.nav-ico{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:grid;place-items:center;background:rgba(124,92,214,.10);font-size:15px;transition:background .18s}
.nav-txt{overflow:hidden;text-overflow:ellipsis}
.nav-badge{margin-left:auto;font-size:10.5px;color:var(--iris-d);background:var(--iris-s);border-radius:8px;padding:1px 6px}

.side-foot{display:flex;flex-direction:column;gap:9px}
.mini-row{display:flex;gap:8px}
.mini-stat{
  flex:1;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);border-radius:14px;
  padding:8px 10px;box-shadow:var(--sh2);
}
.mini-stat span{font-size:10.5px;color:var(--ink3);display:block}
.mini-stat b{font-family:var(--serif);font-size:15px;color:var(--iris-d)}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:16px 30px 12px;background:rgba(255,255,255,.55);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.6);
}
.tb-l{min-width:0}
.tb-l p,.sub{font-size:12.5px;color:var(--ink3)}
.tb-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* 汉堡 / 折叠按钮 */
.menu-btn{
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  width:40px;height:40px;flex:0 0 40px;padding:0 10px;cursor:pointer;
  border-radius:13px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.8);
  box-shadow:var(--sh2);transition:all .18s cubic-bezier(.3,.8,.3,1);
}
.menu-btn span{display:block;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--iris),var(--blue))}
.menu-btn span:nth-child(2){width:70%}
.menu-btn:hover{background:#fff;box-shadow:var(--sh);transform:translateY(-1px)}
.menu-btn:active{transform:scale(.93)}
.sb-toggle .tg{display:inline-block;transition:transform .28s ease}

.sb-overlay{position:fixed;inset:0;background:rgba(30,36,72,.34);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:55;opacity:0;pointer-events:none;transition:opacity .28s ease}
body.sb-open .sb-overlay{opacity:1;pointer-events:auto}

/* ============ 按钮 ============ */
.admin-btn,.btn{
  cursor:pointer;border-radius:13px;border:1px solid rgba(255,255,255,.82);
  background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 14px;color:var(--ink);box-shadow:var(--sh2);
  transition:transform .18s cubic-bezier(.3,.8,.3,1),box-shadow .18s ease,border-color .18s ease,background .18s ease;
  font-size:13.5px;display:inline-flex;align-items:center;gap:6px;line-height:1.4;
}
.btn:hover,.admin-btn:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:rgba(124,92,214,.38);background:#fff}
.btn:active,.admin-btn:active{transform:translateY(0) scale(.97);box-shadow:var(--sh2)}
.btn.gold{background:linear-gradient(135deg,#A98BE8 0%,#7C5CD6 55%,#5B7CE0 100%);color:#fff;font-weight:600;border-color:transparent;box-shadow:0 8px 20px rgba(124,92,214,.28)}
.btn.gold:hover{background:linear-gradient(135deg,#B49BF0 0%,#8467E0 55%,#6A8AE8 100%);box-shadow:0 12px 26px rgba(124,92,214,.36);border-color:transparent}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:11px}
.btn.xs{padding:3px 9px;font-size:11.5px;border-radius:9px}
.btn.danger{color:#C8384F;border-color:rgba(228,85,110,.35);background:rgba(255,255,255,.72)}
.btn.danger:hover{background:rgba(228,85,110,.10);border-color:rgba(228,85,110,.55)}
.btn.plain{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2)}
.btn.plain:hover{background:rgba(255,255,255,.9);box-shadow:var(--sh2)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ============ 卡片 ============ */
.card{
  background:var(--card);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.75);border-radius:var(--r);
  padding:20px 22px;box-shadow:var(--sh);
}
.card+.card{margin-top:18px}
.sec-head{display:flex;align-items:center;gap:10px;margin:28px 0 14px;flex-wrap:wrap}
.sec-head:first-child{margin-top:0}
.sec-head h2{display:flex;align-items:center;gap:8px}
.sec-head .line{flex:1;height:1px;background:var(--line2)}
.card-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-t h3{font-family:var(--serif)}
.muted{color:var(--ink3);font-size:12.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mt-l{margin-top:22px}
.mb{margin-bottom:14px}.mb-s{margin-bottom:8px}
.center{text-align:center}
hr.sep{border:0;border-top:1px dashed var(--line);margin:14px 0}

/* ============ 首页 · Hero ============ */
.hero{
  background:linear-gradient(140deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.56) 58%,rgba(124,92,214,.16) 100%);
  border:1px solid rgba(255,255,255,.82);border-radius:28px;padding:22px 24px;box-shadow:var(--sh);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
}
.hero h1{font-size:26px;margin:4px 0 6px}
.hero-date{font-size:12px;color:var(--ink3);letter-spacing:.6px}
.hero-sub{font-size:13px;color:var(--ink2)}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.hero-ring{text-align:right;min-width:92px}
.hero-stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hs{
  flex:1;min-width:98px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.82);
  border-radius:16px;padding:9px 12px;box-shadow:var(--sh2);transition:transform .2s,box-shadow .2s;
}
.hs:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.hs b{display:block;font-family:var(--serif);font-size:17px;color:var(--iris-d)}
.hs span{font-size:11px;color:var(--ink3)}

/* ============ 首页 · 卡片网格 ============ */
.hgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(214px,1fr))}
.hcard{
  position:relative;cursor:pointer;padding:18px;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.56));
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.8);box-shadow:var(--sh2);
  transition:transform .22s cubic-bezier(.3,.8,.3,1),box-shadow .22s ease,border-color .22s ease;
  animation:rise .42s cubic-bezier(.2,.8,.3,1) both;
}
.hcard::after{
  content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .24s ease;
  background:linear-gradient(140deg,rgba(124,92,214,.12),rgba(78,134,232,0) 62%);
}
.hcard:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(38,43,77,.14);border-color:rgba(124,92,214,.34)}
.hcard:hover::after{opacity:1}
.hcard:active{transform:translateY(-1px) scale(.985)}
.hc-top{display:flex;align-items:center;justify-content:space-between}
.hc-ico{
  width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(145deg,rgba(124,92,214,.18),rgba(78,134,232,.12));
  border:1px solid rgba(255,255,255,.75);
}
.hc-go{color:var(--ink3);font-size:22px;line-height:1;transition:transform .22s ease,color .22s ease}
.hcard:hover .hc-go{transform:translateX(3px);color:var(--iris)}
.hc-name{font-family:var(--serif);font-size:16.5px;font-weight:600;margin-top:12px}
.hc-sub{
  font-size:12px;color:var(--ink3);margin-top:3px;min-height:34px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.hc-foot{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.hc-foot .pg{height:6px;flex:1;max-width:96px}

/* ============ 抽屉 Drawer ============ */
.drawer-mask{position:fixed;inset:0;background:rgba(30,36,72,.30);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:120;opacity:0;transition:opacity .3s ease}
.drawer-mask.show{opacity:1}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);z-index:130;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.80));
  backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
  border-left:1px solid rgba(255,255,255,.82);border-radius:26px 0 0 26px;
  box-shadow:-20px 0 60px rgba(38,43,77,.18);
  transform:translateX(102%);transition:transform .36s cubic-bezier(.22,.9,.28,1);
}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line2)}
.drawer-b{flex:1;overflow-y:auto;padding:14px 18px;-webkit-overflow-scrolling:touch}
.drawer-f{padding:12px 18px 18px;border-top:1px solid var(--line2);display:flex;gap:8px}
.dv-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dv-ico{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:linear-gradient(145deg,rgba(124,92,214,.18),rgba(78,134,232,.12));border:1px solid rgba(255,255,255,.75)}
.dv-head h3{font-family:var(--serif);font-size:17px}

/* ============ 表单控件 ============ */
.inp,.sel,.ta{
  width:100%;background:rgba(255,255,255,.74);border:1px solid var(--line2);border-radius:14px;
  padding:10px 14px;box-shadow:var(--sh-in);outline:none;transition:all .18s ease;color:var(--ink);
}
.inp:focus,.sel:focus,.ta:focus{border-color:rgba(124,92,214,.55);background:#fff;box-shadow:0 0 0 3px rgba(124,92,214,.14)}
.ta{resize:vertical;min-height:74px;line-height:1.75}
.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--iris) 50%),linear-gradient(135deg,var(--iris) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date],input[type=time]{min-width:0}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;letter-spacing:.3px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* ============ 片段组件 ============ */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:11px;font-size:12.5px;
  background:rgba(255,255,255,.68);border:1px solid var(--line2);color:var(--ink2);cursor:pointer;transition:all .16s;white-space:nowrap;
}
.chip:hover{border-color:rgba(124,92,214,.45);background:#fff}
.chip:active{transform:scale(.96)}
.chip.on{background:linear-gradient(135deg,rgba(124,92,214,.18),rgba(78,134,232,.12));border-color:rgba(124,92,214,.38);color:var(--iris-d);font-weight:600}
.chip.static{cursor:default}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.tag{display:inline-block;padding:2px 9px;border-radius:9px;font-size:11.5px;background:rgba(124,92,214,.09);color:var(--ink2);border:1px solid var(--line2)}
.tag.gold{background:rgba(124,92,214,.15);color:var(--iris-d);border-color:rgba(124,92,214,.28)}
.tag.ok{background:rgba(63,169,138,.14);color:#2E8A6C;border-color:rgba(63,169,138,.32)}
.tag.warn{background:rgba(224,163,63,.16);color:#A97424;border-color:rgba(224,163,63,.34)}
.tag.dang{background:rgba(228,85,110,.13);color:#C8384F;border-color:rgba(228,85,110,.32)}
.tag.blue{background:rgba(78,134,232,.14);color:#3566C0;border-color:rgba(78,134,232,.32)}
.tag.purple{background:rgba(140,108,216,.16);color:#6B4FB0;border-color:rgba(140,108,216,.34)}
.num{font-family:var(--serif);font-size:26px;color:var(--iris-d);line-height:1.2}
.num.big{font-size:34px}
.pg{height:9px;border-radius:9px;background:rgba(255,255,255,.6);overflow:hidden;box-shadow:var(--sh-in)}
.pg i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#BFA3EF,#7C5CD6 58%,#5B7CE0);transition:width .5s ease}
.pg.g i{background:linear-gradient(90deg,#8FD8BF,var(--ok))}

.cbx{
  width:22px;height:22px;flex:0 0 22px;border-radius:8px;border:1.5px solid var(--line);
  background:rgba(255,255,255,.8);cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh-in);
  transition:all .18s cubic-bezier(.3,.8,.3,1);font-size:12px;color:transparent;
}
.cbx:hover{border-color:var(--iris);background:#fff}
.cbx:active{transform:scale(.9)}
.cbx.on{background:linear-gradient(145deg,#9B7CE4,#6A4BC4);border-color:#5B3FA8;color:#fff;box-shadow:0 4px 12px rgba(124,92,214,.32)}
.dot-row{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:15px;height:15px;border-radius:5px;background:rgba(255,255,255,.66);box-shadow:var(--sh-in);cursor:pointer;transition:all .16s}
.dot:hover{background:var(--iris-s)}
.dot:active{transform:scale(.86)}
.dot.on{background:linear-gradient(145deg,#B295EC,#7C5CD6)}
.dot.today{outline:1.5px solid var(--iris);outline-offset:1px}

.empty{padding:26px;text-align:center;color:var(--ink3);font-size:13px}
.empty .ei{font-size:26px;display:block;margin-bottom:6px;opacity:.6}

/* 列表项 */
.li{
  display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:15px;
  background:rgba(255,255,255,.6);border:1px solid var(--line2);transition:all .18s;
}
.li+.li{margin-top:8px}
.li:hover{background:rgba(255,255,255,.95);box-shadow:var(--sh2);transform:translateY(-1px)}
.li.done{opacity:.55}
.li.done .li-t{text-decoration:line-through}
.li-b{flex:1;min-width:0}
.li-t{font-size:14px;word-break:break-word}
.li-m{font-size:11.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center}
.icon-btn{cursor:pointer;opacity:.5;transition:all .16s;font-size:14px;background:none;border:0;padding:2px 5px;border-radius:8px}
.icon-btn:hover{opacity:1;background:var(--iris-s)}
.icon-btn:active{transform:scale(.9)}

/* 待办条目（近期待办） */
.titem{
  display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:18px;
  background:rgba(255,255,255,.58);border:1px solid var(--line2);
  transition:background .18s ease,box-shadow .18s ease,transform .18s cubic-bezier(.3,.8,.3,1);
}
.titem+.titem{margin-top:9px}
.titem:hover{background:rgba(255,255,255,.94);box-shadow:var(--sh2);transform:translateY(-1px)}
.titem.done{opacity:.5}
.titem.done .t-title{text-decoration:line-through;color:var(--ink3)}
.t-b{flex:1;min-width:0}
.t-title{
  width:100%;border:1px solid transparent;background:transparent;border-radius:10px;
  padding:3px 7px;font-size:14.5px;outline:none;transition:all .16s ease;
}
.t-title:hover{background:rgba(255,255,255,.7)}
.t-title:focus{background:#fff;border-color:rgba(124,92,214,.45);box-shadow:0 0 0 3px rgba(124,92,214,.12)}
.t-meta{display:flex;align-items:center;gap:7px;margin:6px 0 0 3px;flex-wrap:wrap}
.t-sel{
  width:auto;min-width:106px;padding:5px 26px 5px 10px;font-size:12px;border-radius:11px;
  background:rgba(255,255,255,.8);border:1px solid var(--line2);box-shadow:var(--sh-in);
  appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;transition:all .16s ease;
  background-image:linear-gradient(45deg,transparent 50%,var(--iris) 50%),linear-gradient(135deg,var(--iris) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.t-sel:hover{border-color:rgba(124,92,214,.45);background-color:#fff}
.t-sel:focus{border-color:var(--iris);box-shadow:0 0 0 3px rgba(124,92,214,.14)}
.t-del{
  flex:0 0 auto;width:30px;height:30px;border-radius:11px;cursor:pointer;display:grid;place-items:center;
  border:1px solid rgba(228,85,110,.30);background:rgba(228,85,110,.08);color:var(--danger);
  font-size:14px;line-height:1;opacity:.82;transition:all .16s cubic-bezier(.3,.8,.3,1);
}
.t-del:hover{opacity:1;background:rgba(228,85,110,.16);border-color:rgba(228,85,110,.55);transform:scale(1.07)}
.t-del:active{transform:scale(.92)}
.add-row{margin-top:12px}
.add-btn{
  width:100%;justify-content:center;cursor:pointer;padding:11px;border-radius:16px;
  border:1.5px dashed rgba(124,92,214,.45);background:rgba(255,255,255,.5);color:var(--iris-d);
  font-size:13.5px;display:flex;align-items:center;gap:6px;font-family:inherit;
  transition:all .18s cubic-bezier(.3,.8,.3,1);
}
.add-btn:hover{background:rgba(255,255,255,.95);border-color:var(--iris);box-shadow:var(--sh2);transform:translateY(-1px)}
.add-btn:active{transform:translateY(0) scale(.985)}

/* 表格 */
.tw{overflow-x:auto;border-radius:var(--r2);border:1px solid var(--line2);background:rgba(255,255,255,.8);backdrop-filter:blur(10px);box-shadow:var(--sh2)}
table.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px}
table.tb th{
  background:rgba(124,92,214,.08);font-family:var(--serif);font-weight:600;font-size:12.5px;color:var(--ink2);
  padding:11px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line2);position:sticky;top:0;
  backdrop-filter:blur(8px);
}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr:hover{background:rgba(124,92,214,.06)}
table.tb.zebra tbody tr:nth-child(even){background:rgba(124,92,214,.04)}
.tb-scroll{max-height:520px;overflow:auto}

/* 统计小卡 */
.stat{
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);border-radius:18px;padding:14px 16px;box-shadow:var(--sh2);
  display:flex;flex-direction:column;gap:2px;
}
.stat .lb{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.stat .vv{font-family:var(--serif);font-size:24px;color:var(--iris-d)}
.stat .ex{font-size:11.5px;color:var(--ink3)}
.stat.link{cursor:pointer;transition:all .2s cubic-bezier(.3,.8,.3,1)}
.stat.link:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:rgba(124,92,214,.3)}

/* 倒计时 */
.cd{
  background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(244,239,255,.72));border:1px solid rgba(124,92,214,.18);
  border-radius:20px;padding:14px 18px;text-align:center;box-shadow:var(--sh2);
}
.cd .d{font-family:var(--serif);font-size:30px;color:var(--iris-d);line-height:1.1}
.cd .l{font-size:11.5px;color:var(--ink3)}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(30,36,72,.34);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .22s ease}
.modal{
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.85));
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.85);border-radius:26px;box-shadow:0 24px 60px rgba(38,43,77,.24);
  width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;animation:pop .26s cubic-bezier(.2,.9,.3,1.2);
}
.modal.wide{max-width:860px}
.modal.xwide{max-width:1040px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line2)}
.modal-h h3{flex:1}
.modal-b{padding:16px 20px;overflow-y:auto}
.modal-f{padding:12px 20px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Toast */
.toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:rgba(38,43,77,.94);color:#F4F1FF;padding:9px 18px;border-radius:14px;font-size:13px;
  box-shadow:0 10px 26px rgba(38,43,77,.28);animation:up .26s ease;max-width:86vw;text-align:center;
}

/* 后台专用 */
.admin-wrap{display:flex;flex-direction:column;gap:14px}
.srow{
  display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.8);border:1px solid var(--line2);
  border-radius:16px;padding:10px 12px;box-shadow:var(--sh2);flex-wrap:wrap;transition:box-shadow .18s,border-color .18s;
}
.srow:hover{box-shadow:var(--sh);border-color:rgba(124,92,214,.28)}
.srow.hide{opacity:.5;background:rgba(124,92,214,.06)}
.srow.drag{opacity:.4}
.srow.over{border-color:var(--iris);box-shadow:var(--sh)}
.handle{cursor:grab;color:var(--ink3);font-size:15px;padding:0 2px;user-select:none}
.srow .nm{flex:1;min-width:0}
.srow .nm input{font-family:var(--serif);font-size:14.5px;font-weight:600;background:transparent;border:1px solid transparent;box-shadow:none;padding:3px 8px;border-radius:9px}
.srow .nm input:focus{background:rgba(255,255,255,.9);border-color:var(--iris);box-shadow:var(--sh-in)}
.srow .nm .meta{font-size:11px;color:var(--ink3);padding-left:9px}
.tool-box{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.82);border-radius:18px;padding:15px 17px;box-shadow:var(--sh2);transition:transform .2s,box-shadow .2s}
.tool-box:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.dz{border:1.5px dashed rgba(124,92,214,.4);border-radius:16px;padding:18px;text-align:center;color:var(--ink3);font-size:13px;background:rgba(255,255,255,.6)}
.switch{width:42px;height:24px;border-radius:14px;background:rgba(124,92,214,.16);border:1px solid var(--line2);position:relative;cursor:pointer;transition:all .2s;flex:0 0 42px}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:all .2s}
.switch.on{background:linear-gradient(145deg,#9B7CE4,#6A4BC4);border-color:#5B3FA8}
.switch.on i{left:20px}

/* 多段Tab */
.seg{display:inline-flex;background:rgba(255,255,255,.7);border:1px solid var(--line2);border-radius:14px;padding:3px;gap:2px;box-shadow:var(--sh-in);flex-wrap:wrap}
.seg button{
  border:0;background:transparent;border-radius:11px;padding:5px 12px;cursor:pointer;color:var(--ink2);
  font-size:12.8px;transition:all .16s;white-space:nowrap;
}
.seg button:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.seg button:active{transform:scale(.95)}
.seg button.on{background:#fff;color:var(--iris-d);font-weight:600;box-shadow:var(--sh2)}

/* iframe 文档 */
.docbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.docframe{
  width:100%;border:0;border-radius:18px;background:#fff;box-shadow:var(--sh-in);display:block;
  border:1px solid var(--line2);
}
.docfallback{padding:34px 20px;text-align:center;color:var(--ink3)}

/* 折叠 */
details.fold{border:1px solid var(--line2);border-radius:16px;background:rgba(255,255,255,.78);box-shadow:var(--sh2);overflow:hidden}
details.fold+details.fold{margin-top:9px}
details.fold>summary{padding:12px 15px;cursor:pointer;font-family:var(--serif);font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--iris);transition:transform .2s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold .fold-b{padding:0 15px 14px}

.kv{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.kv:last-child{border:0}
.kv .k{color:var(--ink3);flex:0 0 88px;font-size:12.5px}
.kv .v{flex:1;color:var(--ink);word-break:break-word}

.tip{
  background:rgba(255,255,255,.62);border:1px solid var(--line2);border-radius:14px;padding:10px 13px;
  font-size:12.5px;color:var(--ink2);line-height:1.7;
}
.warnbox{background:rgba(228,85,110,.10);border:1px solid rgba(228,85,110,.30);border-radius:14px;padding:10px 13px;font-size:12.5px;color:#A83A50}

/* ============ 动画 ============ */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ============ 平板 ============ */
@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .hgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}

/* ============ 手机端：左侧抽屉式 Sidebar ============ */
@media(max-width:880px){
  body{font-size:14px}
  .app{flex-direction:column}
  .sidebar{
    width:272px;flex:0 0 272px;transform:translateX(-104%);
    box-shadow:14px 0 44px rgba(38,43,77,.22);padding:18px 14px;
  }
  body.sb-open .sidebar{transform:none}
  body.sb-min .sidebar{width:272px;flex:0 0 272px;padding:18px 14px}
  body.sb-min .main{margin-left:0}
  body.sb-min .brand{justify-content:flex-start}
  body.sb-min .brand-txt,body.sb-min .nav-txt,body.sb-min .adm-txt{display:flex}
  body.sb-min .nav-label{display:block}
  body.sb-min .mini-row{display:flex}
  body.sb-min .nav-item{justify-content:flex-start;padding:11px 13px}
  .brand{flex:0 0 auto;padding:0}
  .brand-txt strong{font-size:15px}
  .brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:13px;font-size:18px}

/* ============ 激励卡 / 长期目标 / 倒数日 ============ */
.quote{

  border:1px solid rgba(255,255,255,.82);border-radius:24px;padding:20px 22px;box-shadow:var(--sh);

.quote .qz{font-family:var(--serif);font-size:19px;line-height:1.65;letter-spacing:.6px}
.quote .qe{font-size:12.5px;color:var(--ink3);margin-top:8px;font-style:italic;line-height:1.6}

.lg{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:15px;background:rgba(255,255,255,.58);border:1px solid var(--line2);transition:all .18s}

.lg .lb{flex:1;min-width:0}
.lg .lt{font-size:14px}
.lg .ln{font-size:11.5px;color:var(--ink3);margin-top:2px}
.lg.done .lt{text-decoration:line-through;color:var(--ink3)}

.cds{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}
.cdcard{position:relative;cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:14px 12px;text-align:center;box-shadow:var(--sh2);transition:transform .2s,box-shadow .2s}
.cdcard:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.cdcard:active{transform:scale(.98)}
.cdcard .n{font-family:var(--serif);font-size:30px;color:var(--iris-d);line-height:1.1}
.cdcard .t{font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.g30{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-top:6px}
.g30 i{aspect-ratio:1/1;border-radius:3px;background:rgba(255,255,255,.62);box-shadow:inset 0 1px 2px rgba(38,43,77,.10);cursor:pointer;transition:all .15s}
.g30 i:hover{background:var(--iris-s)}
.g30 i:active{transform:scale(.86)}
.g30 i.on{background:linear-gradient(145deg,#9B7CE4,#6A4BC4)}
.g30 i.today{outline:1.5px solid var(--iris);outline-offset:1px}
.g30 i.off{opacity:.22;cursor:default;background:transparent;box-shadow:none}

.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

xt time → nex-time"]},{"k":"句子重音","d":"实词（名/动/形/副/疑问词）重读，虚词弱读。节奏靠重音等距而非音节数。","ex":["I WANT to GO to the STORE.","She DIDN'T SAY that."]}],"WORDBOOKS":{"CET4":[{"w":"abandon","ipa":"/əˈbændən/","pos":"v.","en":"to leave a person, place, or thing forever, especially when you should stay","cn":"抛弃；放弃","ex":"They had to abandon the car and walk home."},{"w":"accompany","ipa":"/əˈkʌmpəni/","pos":"v.","en":"to go somewhere with someone","cn":"陪伴；伴随","ex":"She accompanied her mother to the hospital."},{"w":"acquire","ipa":"/əˈkwaɪr/","pos":"v.","en":"to get or obtain something, often over a period of time","cn":"获得；习得","ex":"He acquired a taste for classical music."},{"w":"adequate","ipa":"/ˈædɪkwət/","pos":"adj.","en":"enough in quantity or good enough in quality for a purpose","cn":"足够的；适当的","ex":"The food was adequate but not exciting."},{"w":"adjust","ipa":"/əˈdʒʌst/","pos":"v.","en":"to change something slightly so it works better or fits better","cn":"调整；适应","ex":"It took her a month to adjust to the new job."},{"w":"anxiety","ipa":"/æŋˈzaɪəti/","pos":"n.","en":"a feeling of worry or fear about something that may happen","cn":"焦虑；担忧","ex":"Exam anxiety affects many students."},{"w":"approach","ipa":"/əˈproʊtʃ/","pos":"n./v.","en":"a way of dealing with something; to move closer to something","cn":"方法；接近","ex":"We need a new approach to this problem."},{"w":"assume","ipa":"/əˈsuːm/","pos":"v.","en":"to believe something is true without proof","cn":"假定；承担","ex":"I assumed you knew about the meeting."},{"w":"benefit","ipa":"/ˈbenɪfɪt/","pos":"n./v.","en":"an advantage or good result; to receive an advantage","cn":"益处；受益","ex":"Regular exercise benefits both body and mind."},{"w":"capable","ipa":"/ˈkeɪpəbl/","pos":"adj.","en":"having the ability or skill to do something","cn":"有能力的","ex":"She is capable of handling the whole project."},{"w":"commit","ipa":"/kəˈmɪt/","pos":"v.","en":"to promise to do something; to do something wrong","cn":"承诺；犯（错）","ex":"He committed himself to finishing the report."},{"w":"consequence","ipa":"/ˈkɑːnsəkwens/","pos":"n.","en":"a result of a particular action or situation","cn":"后果；结果","ex":"She had to face the consequences of her decision."},{"w":"consistent","ipa":"/kənˈsɪstənt/","pos":"adj.","en":"always behaving or happening in the same way","cn":"一致的；持续的","ex":"Consistent effort matters more than talent."},{"w":"contribute","ipa":"/kənˈtrɪbjuːt/","pos":"v.","en":"to give something, especially money or help, to a shared goal","cn":"贡献；促成","ex":"Everyone contributed ideas to the plan."},{"w":"convince","ipa":"/kənˈvɪns/","pos":"v.","en":"to make someone believe that something is true","cn":"说服；使确信","ex":"The data convinced the manager to change strategy."},{"w":"demonstrate","ipa":"/ˈdemənstreɪt/","pos":"v.","en":"to show clearly that something exists or is true","cn":"证明；演示","ex":"The results demonstrate a clear improvement."},{"w":"distinguish","ipa":"/dɪˈstɪŋɡwɪʃ/","pos":"v.","en":"to see or understand the difference between two things","cn":"区分；辨别","ex":"It is hard to distinguish the copy from the original."},{"w":"efficient","ipa":"/ɪˈfɪʃnt/","pos":"adj.","en":"working well without wasting time, money, or energy","cn":"高效的","ex":"The new system is far more efficient."},{"w":"emphasize","ipa":"/ˈemfəsaɪz/","pos":"v.","en":"to give special importance or attention to something","cn":"强调","ex":"The teacher emphasized the importance of practice."},{"w":"essential","ipa":"/ɪˈsenʃl/","pos":"adj.","en":"completely necessary; extremely important","cn":"必不可少的","ex":"Sleep is essential for learning."},{"w":"estimate","ipa":"/ˈestɪmeɪt/","pos":"v./n.","en":"to guess the size, cost, or value of something using available information","cn":"估计；估算","ex":"Experts estimate the cost at 5 million."},{"w":"evidence","ipa":"/ˈevɪdəns/","pos":"n.","en":"facts or signs that show something is true","cn":"证据","ex":"There is strong evidence supporting the theory."},{"w":"expand","ipa":"/ɪkˈspænd/","pos":"v.","en":"to become larger in size, number, or importance","cn":"扩张；扩展","ex":"The company plans to expand into new markets."},{"w":"feature","ipa":"/ˈfiːtʃər/","pos":"n./v.","en":"an important or noticeable part or quality of something","cn":"特征；以…为特色","ex":"The main feature of the app is offline access."},{"w":"frequent","ipa":"/ˈfriːkwənt/","pos":"adj.","en":"happening often","cn":"频繁的","ex":"Frequent short reviews beat one long session."},{"w":"generate","ipa":"/ˈdʒenəreɪt/","pos":"v.","en":"to produce or create something","cn":"产生；生成","ex":"The campaign generated a lot of interest."},{"w":"guarantee","ipa":"/ˌɡærənˈtiː/","pos":"v./n.","en":"to promise that something will certainly happen or be done","cn":"保证；保修","ex":"Hard work does not guarantee success, but it helps."},{"w":"identify","ipa":"/aɪˈdentɪfaɪ/","pos":"v.","en":"to recognize someone or something and say who or what they are","cn":"识别；确认","ex":"We must identify the real problem first."},{"w":"impact","ipa":"/ˈɪmpækt/","pos":"n./v.","en":"a powerful effect that something has on a situation or person","cn":"影响；冲击","ex":"Social media has a huge impact on young people."},{"w":"indicate","ipa":"/ˈɪndɪkeɪt/","pos":"v.","en":"to show that something is true or exists","cn":"表明；指示","ex":"The data indicate a rising trend."},{"w":"maintain","ipa":"/meɪnˈteɪn/","pos":"v.","en":"to keep something in the same condition or continue it","cn":"维持；保养","ex":"It is hard to maintain a daily habit for 100 days."},{"w":"obtain","ipa":"/əbˈteɪn/","pos":"v.","en":"to get something, especially by making an effort","cn":"获得","ex":"She obtained a scholarship last year."},{"w":"participate","ipa":"/pɑːrˈtɪsɪpeɪt/","pos":"v.","en":"to take part in an activity or event","cn":"参加；参与","ex":"All students participated in the survey."},{"w":"previous","ipa":"/ˈpriːviəs/","pos":"adj.","en":"happening or existing before the one you are talking about","cn":"先前的","ex":"Compared with the previous version, it is faster."},{"w":"reduce","ipa":"/rɪˈduːs/","p ensate for a late start."},{"w":"comprehensive","ipa":"/ˌkɑːmprɪˈhensɪv/","pos":"adj.","en":"including everything that is necessary; complete","cn":"全面的","ex":"The report gives a comprehensive review."},{"w":"constraint","ipa":"/kənˈstreɪnt/","pos":"n.","en":"something that limits your freedom to act","cn":"限制；约束","ex":"Time is the main constraint on this project."},{"w":"contemporary","ipa":"/kənˈtempəreri/","pos":"adj.","en":"belonging to the present time; modern","cn":"当代的","ex":"Contemporary design favours simplicity."},{"w":"controversial","ipa":"/ˌkɑːntrəˈvɜːrʃl/","pos":"adj.","en":"causing strong disagreement between people","cn":"有争议的","ex":"It remains a controversial topic among experts."},{"w":"deteriorate","ipa":"/dɪˈtɪriəreɪt/","pos":"v.","en":"to become worse in condition or quality","cn":"恶化","ex":"Sleep quality deteriorates under stress."},{"w":"diminish","ipa":"/dɪˈmɪnɪʃ/","pos":"v.","en":"to become smaller or less important","cn":"减少；削弱","ex":"Interest diminished after the first week."},{"w":"distort","ipa":"/dɪˈstɔːrt/","pos":"v.","en":"to change facts or a shape so it is no longer true or natural","cn":"扭曲；歪曲","ex":"Selective data can distort the conclusion."},{"w":"elaborate","ipa":"/ɪˈlæbərət/","pos":"adj./v.","en":"very detailed and complicated; to explain in more detail","cn":"精心制作的；详述","ex":"Could you elaborate on that point?"},{"w":"endorse","ipa":"/ɪnˈdɔːrs/","pos":"v.","en":"to publicly say you support or approve of something","cn":"支持；代言","ex":"Several athletes endorse the brand."},{"w":"exaggerate","ipa":"/ɪɡˈzædʒəreɪt/","pos":"v.","en":"to describe something as better, worse, or bigger than it really is","cn":"夸大","ex":"Never exaggerate numbers in a portfolio."},{"w":"facilitate","ipa":"/fəˈsɪlɪteɪt/","pos":"v.","en":"to make an action or process easier","cn":"促进；使便利","ex":"Templates facilitate faster writing."},{"w":"feasible","ipa":"/ˈfiːzəbl/","pos":"adj.","en":"possible to do easily or conveniently","cn":"可行的","ex":"Is a daily post feasible for you?"},{"w":"fluctuate","ipa":"/ˈflʌktʃueɪt/","pos":"v.","en":"to change frequently in level or amount","cn":"波动","ex":"Engagement rates fluctuate week to week."},{"w":"implement","ipa":"/ˈɪmplɪment/","pos":"v.","en":"to put a plan or decision into action","cn":"实施；执行","ex":"We implemented the new schedule in August."},{"w":"inevitable","ipa":"/ɪnˈevɪtəbl/","pos":"adj.","en":"certain to happen and impossible to avoid","cn":"不可避免的","ex":"Some rejection is inevitable in job hunting."},{"w":"integrate","ipa":"/ˈɪntɪɡreɪt/","pos":"v.","en":"to combine two or more things so they work together","cn":"整合；融合","ex":"The app integrates notes and reminders."},{"w":"intrinsic","ipa":"/ɪnˈtrɪnzɪk/","pos":"adj.","en":"belonging naturally to something; essential to its nature","cn":"内在的；固有的","ex":"Intrinsic motivation lasts longer than rewards."},{"w":"legitimate","ipa":"/lɪˈdʒɪtɪmət/","pos":"adj.","en":"allowed by law, or fair and reasonable","cn":"合法的；合理的","ex":"That is a legitimate concern."},{"w":"manipulate","ipa":"/məˈnɪpjuleɪt/","pos":"v.","en":"to control something or someone skilfully, often unfairly","cn":"操控；操纵","ex":"Do not manipulate the data to look better."},{"w":"notion","ipa":"/ˈnoʊʃn/","pos":"n.","en":"an idea, belief, or understanding of something","cn":"概念；观念","ex":"The notion that talent is fixed is outdated."},{"w":"objective","ipa":"/əbˈdʒektɪv/","pos":"n./adj.","en":"a goal you plan to achieve; based on facts rather than feelings","cn":"目标；客观的","ex":"Set one measurable objective per week."},{"w":"perceive","ipa":"/pərˈsiːv/","pos":"v.","en":"to notice or understand something in a particular way","cn":"感知；认为","ex":"Users perceive the brand as trustworthy."},{"w":"plausible","ipa":"/ˈplɔːzəbl/","pos":"adj.","en":"seeming reasonable or likely to be true","cn":"看似合理的","ex":"That is a plausible explanation."},{"w":"preliminary","ipa":"/prɪˈlɪmɪneri/","pos":"adj.","en":"happening before a more important action or event","cn":"初步的","ex":"These are only preliminary results."},{"w":"prevail","ipa":"/prɪˈveɪl/","pos":"v.","en":"to be most common or general; to finally win","cn":"盛行；获胜","ex":"Simplicity usually prevails over decoration."},{"w":"reinforce","ipa":"/ˌriːɪnˈfɔːrs/","pos":"v.","en":"to make something stronger, especially a feeling or idea","cn":"强化；加固","ex":"Repetition reinforces memory."},{"w":"resilient","ipa":"/rɪˈzɪliənt/","pos":"adj.","en":"able to recover quickly after difficulties","cn":"有韧性的","ex":"Job hunting rewards resilient people."},{"w":"scrutiny","ipa":"/ˈskruːtəni/","pos":"n.","en":"careful and detailed examination","cn":"仔细审查","ex":"Public companies face constant scrutiny."},{"w":"substantial","ipa":"/səbˈstænʃl/","pos":"adj.","en":"large in amount, value, or importance","cn":"大量的；实质的","ex":"She made substantial progress in one month."},{"w":"sustain","ipa":"/səˈsteɪn/","pos":"v.","en":"to keep something going over time","cn":"维持；支撑","ex":"Can you sustain this pace until November?"},{"w":"transparent","ipa":"/trænsˈpærənt/","pos":"adj.","en":"open and honest, with nothing hidden","cn":"透明的；坦诚的","ex":"Be transparent about your real numbers."},{"w":"undermine","ipa":"/ˌʌndərˈmaɪn/","pos":"v.","en":"to gradually make something weaker or less effective","cn":"削弱；损害","ex":"Fake data undermines your credibility."},{"w":"versatile","ipa":"/ˈvɜːrsətl/","pos":"adj.","en":"able to be used for many different purposes; having many skills","cn":"多才多艺的；多用途的","ex":"A versatile skill set helps in small teams."},{"w":"viable","ipa":"/ˈvaɪəbl/","pos":"adj.","en":"able to work successfully","cn":"可行的；有生命力的","ex":"Is this a viable long-term plan?"}],"IELTS":[{"w":"abundant","ipa":"/əˈbʌndənt/","pos":"adj.","en":"existing in very large quantities; more than enough","cn":"丰富的","ex":"The region has abundant natural resources."},{"w":"alleviate","ipa":"/əˈliːvieɪt/","pos":"v.","en":"to make a problem or bad feeling less severe","cn":"缓解；减轻","ex":"Public transport can alleviate traffic congestion."},{"w":"allocate","ipa":"/ˈæləkeɪt/","pos":"v.","en":"to officially give something to someone for a particular purpose","cn":"分配","ex":"Governments should allocate more funds to education."},{"w":"aspiration","ipa":"/ˌæspəˈreɪʃn/","pos":"n.","en":"a strong desire to achieve something","cn":"志向；抱负","ex":"Career aspirations shift as people grow older."},{"w":"compulsory","ipa":"/kəmˈpʌlsəri/","pos":"adj.","en":"required by law or a rule; must be done","cn":"强制的；必修的","ex":"Education is compulsory up to the age of sixteen."},{"w":"conservation","ipa":"/ˌkɑːnsərˈveɪʃn/","pos":"n.","en":"the protection of nature, resources, or historic things","cn":"保护；保存","ex":"Water conservation is now a global priority."},{"w":"curriculum","ipa":"/kəˈrɪkjələm/","pos":"n.","en":"the subjects included in a course of study","cn":"课程；教学大纲","ex":"The curriculum should include practical skills."},{"w":"deterrent","ipa":"/dɪˈtɜːrənt/","pos":"n.","en":"something that makes people less likely to do something","cn":"威慑物","ex":"Higher fines act as a deterrent to speeding."},{"w":"disparity","ipa":"/dɪˈspærəti/","pos":"n.","en":"a clear and unfair difference between things","cn":"差距；不平等","ex":"There is a wide income disparity between regions."},{"w":"diversity","ipa":"/daɪˈvɜːrsəti/","pos":"n.","en":"the state of having many different kinds of people or things","cn":"多样性","ex":"Cultural diversity enriches a city."},{"w":"emission","ipa":"/ɪˈmɪʃn/","pos":"n.","en":"gas or other substance sent out into the air","cn":"排放（物）","ex":"Carbon emissions must be cut sharply."},{"w":"enhance","ipa":"/ɪnˈhæns/","pos":"v.","en":"to improve the quality, value, or level of something","cn":"提升；增强","ex":"Technology can enhance the learning experience."},{"w":"exposure","ipa":"/ɪkˈspoʊʒər/","pos":"n.","en":"the state of experiencing something or being affected by it","cn":"接触；曝光","ex":"Early exposure to a language improves accent."},{"w":"incentive","ipa":"/ɪnˈsentɪv/","pos":"n.","en":"something that encourages you to do something","cn":"激励；动机","ex":"Tax breaks are an incentive to invest."},{"w":"infrastructure","ipa":"/ˈɪnfrəstrʌktʃər/","pos":"n.","en":"the basic systems a country needs, such as roads and power","cn":"基础设施","ex":"Rural infrastructure needs heavy investment."},{"w":"innovation","ipa":"/ˌɪnəˈveɪʃn/","pos":"n.","en":"a new idea, method, or product","cn":"创新","ex":"Innovation drives long-term growth."},{"w":"legislation","ipa":"/ˌledʒɪsˈleɪʃn/","pos":"n.","en":"a law or set of laws","cn":"立法；法规","ex":"New legislation limits plastic packaging."},{"w":"mandatory","ipa":"/ˈmændətɔːri/","pos":"adj.","en":"required by a rule or law","cn":"强制性的","ex":"Helmets are mandatory for all riders."},{"w":"obesity","ipa":"/oʊˈbiːsəti/","pos":"n.","en":"the condition of being extremely overweight","cn":"肥胖症","ex":"Childhood obesity has risen sharply."},{"w":"phenomenon","ipa":"/fəˈnɑːmɪnən/","pos":"n.","en":"something that exists or happens, especially something unusual","cn":"现象","ex":"Remote work is a global phenomenon now."},{"w":"prohibit","ipa":"/prəˈhɪbɪt/","pos":"v.","en":"to officially stop something from being done","cn":"禁止","ex":"The law prohibits advertising to children."},{"w":"sedentary","ipa":"/ˈsednteri/","pos":"adj.","en":"involving a lot of sitting and little exercise","cn":"久坐的","ex":"A sedentary lifestyle harms health."},{"w":"subsidy","ipa":"/ˈsʌbsədi/","pos":"n.","en":"money paid by a government to reduce the cost of something","cn":"补贴","ex":"Farming subsidies remain controversial."},{"w":"urbanization","ipa":"/ˌɜːrbənəˈzeɪʃn/","pos":"n.","en":"the process of more people moving to live in cities","cn":"城市化","ex":"Rapid urbanization strains public services."},{"w":"welfare","ipa":"/ˈwelfer/","pos":"n.","en":"the health and happiness of people; government support","cn":"福利；福祉","ex":"Animal welfare standards have improved."},{"w":"authentic","ipa":"/ɔːˈθentɪk/","pos":"adj.","en":"real and genuine, not a copy","cn":"真实的；地道的","ex":"Readers can tell whether a review is authentic."},{"w":"crucial","ipa":"/ˈkruːʃl/","pos":"adj.","en":"extremely important because it affects the result","cn":"至关重要的","ex":"The first three seconds are crucial in a video."},{"w":"dilemma","ipa":"/dɪˈlemə/","pos":"n.","en":"a difficult choice between two options","cn":"两难困境","ex":"She faced a dilemma between exams and internship."},{"w":"discrepancy","ipa":"/dɪsˈkrepənsi/","pos":"n.","en":"a difference between two things that should be the same","cn":"不一致；差异","ex":"There is a discrepancy between the two reports."},{"w":"inherent","ipa":"/ɪnˈhɪrənt/","pos":"adj.","en":"existing as a natural or permanent part of something","cn":"固有的","ex":"Risk is inherent in any new venture."},{"w":"nurture","ipa":"/ˈnɜːrtʃər/","pos":"v.","en":"to care for and help something grow or develop","cn":"培育；培养","ex":"Schools should nurture curiosity."},{"w":"paramount","ipa":"/ˈpærəmaʊnt/","pos":"adj.","en":"more important than anything else","cn":"至高无上的","ex":"Safety is paramount on site."},{"w":"proficiency","ipa":"/prəˈfɪʃnsi/","pos":"n.","en":"a high level of skill in something","cn":"熟练；精通","ex":"English proficiency opens more job options."},{"w":"prominent","ipa":"/ˈprɑːmɪnənt/","pos":"adj.","en":"important and well known; easy to see","cn":"突出的；著名的","ex":"Put the key point in a prominent position."},{"w":"reluctant","ipa":"/rɪˈlʌktənt/","pos":"adj.","en":"unwilling to do something and slow to act","cn":"不情愿的","ex":"Many are reluctant to leave a stable job."},{"w":"scarce","ipa":"/skers/","pos":"adj.","en":"not easy to find or get; existing in small amounts","cn":"稀缺的","ex":"Fresh water is scarce in that region."},{"w":"tackle","ipa":"/ˈtækl/","pos":"v.","en":"to try hard to deal with a difficult problem","cn":"应对；解决","ex":"We need better tools to tackle pollution."},{"w":"tremendous","ipa":"/trəˈmendəs/","pos":"adj.","en":"very great in amount, scale, or intensity","cn":"巨大的","ex":"She made tremendous progress this term."},{"w":"utilize","ipa":"/ˈjuːtəlaɪz/","pos":"v.","en":"to ce or understand something that is not obvious","cn":"辨别；察觉","ex":"It is hard to discern a pattern from ten data points."},{"w":"empirical","ipa":"/ɪmˈpɪrɪkl/","pos":"adj.","en":"based on observation or experiment rather than theory","cn":"实证的","ex":"There is little empirical support for that claim."},{"w":"explicit","ipa":"/ɪkˈsplɪsɪt/","pos":"adj.","en":"stated clearly and in detail, leaving no doubt","cn":"明确的","ex":"Give explicit instructions, not hints."},{"w":"hypothesis","ipa":"/haɪˈpɑːθəsɪs/","pos":"n.","en":"an idea suggested as an explanation, not yet proved","cn":"假设","ex":"The hypothesis was tested in three experiments."},{"w":"implicit","ipa":"/ɪmˈplɪsɪt/","pos":"adj.","en":"suggested but not stated directly","cn":"含蓄的；隐含的","ex":"There is an implicit assumption in that plan."},{"w":"incremental","ipa":"/ˌɪŋkrəˈmentl/","pos":"adj.","en":"increasing gradually in small amounts","cn":"递增的；渐进的","ex":"Incremental gains compound over months."},{"w":"indispensable","ipa":"/ˌɪndɪˈspensəbl/","pos":"adj.","en":"too important to manage without","cn":"不可或缺的","ex":"A good outline is indispensable for essays."},{"w":"intricate","ipa":"/ˈɪntrɪkət/","pos":"adj.","en":"having many small parts arranged in a complex way","cn":"错综复杂的","ex":"The design has an intricate pattern."},{"w":"meticulous","ipa":"/məˈtɪkjələs/","pos":"adj.","en":"very careful about small details","cn":"一丝不苟的","ex":"She keeps meticulous records of her data."},{"w":"mitigate","ipa":"/ˈmɪtɪɡeɪt/","pos":"v.","en":"to make something bad less serious","cn":"减轻；缓和","ex":"Planning ahead mitigates risk."},{"w":"nuance","ipa":"/ˈnuːɑːns/","pos":"n.","en":"a very small difference in meaning, feeling, or sound","cn":"细微差别","ex":"Native speakers catch nuances of tone."},{"w":"paradigm","ipa":"/ˈpærədaɪm/","pos":"n.","en":"a typical model or pattern of how something works","cn":"范式；模式","ex":"Short video changed the content paradigm."},{"w":"pervasive","ipa":"/pərˈveɪsɪv/","pos":"adj.","en":"existing everywhere in a place or thing","cn":"普遍存在的","ex":"Smartphone use is pervasive among teens."},{"w":"proliferate","ipa":"/prəˈlɪfəreɪt/","pos":"v.","en":"to increase rapidly in number","cn":"激增；扩散","ex":"AI tools have proliferated since 2023."},{"w":"refute","ipa":"/rɪˈfjuːt/","pos":"v.","en":"to prove that a statement or idea is wrong","cn":"驳斥","ex":"The new data refute the earlier theory."},{"w":"rigorous","ipa":"/ˈrɪɡərəs/","pos":"adj.","en":"careful, thorough, and strictly accurate","cn":"严谨的；严格的","ex":"The study followed a rigorous method."},{"w":"skeptical","ipa":"/ˈskeptɪkl/","pos":"adj.","en":"doubting that something is true or useful","cn":"怀疑的","ex":"Be skeptical of numbers without a source."},{"w":"subsequent","ipa":"/ˈsʌbsɪkwənt/","pos":"adj.","en":"happening after something else","cn":"随后的","ex":"Subsequent tests confirmed the result."},{"w":"synthesis","ipa":"/ˈsɪnθəsɪs/","pos":"n.","en":"the combining of separate parts into a whole","cn":"综合；合成","ex":"A good conclusion is a synthesis, not a summary."},{"w":"tangible","ipa":"/ˈtændʒəbl/","pos":"adj.","en":"real and able to be clearly seen or measured","cn":"有形的；实在的","ex":"Show tangible results in your portfolio."},{"w":"unprecedented","ipa":"/ʌnˈpresɪdentɪd/","pos":"adj.","en":"never having happened before","cn":"前所未有的","ex":"The growth rate is unprecedented."},{"w":"ubiquitous","ipa":"/juːˈbɪkwɪtəs/","pos":"adj.","en":"seeming to be everywhere at the same time","cn":"无处不在的","ex":"QR codes are ubiquitous in China."},{"w":"validate","ipa":"/ˈvælɪdeɪt/","pos":"v.","en":"to prove that something is correct or acceptable","cn":"验证；确认","ex":"Validate your idea with a small test first."},{"w":"coincide","ipa":"/ˌkoʊɪnˈsaɪd/","pos":"v.","en":"to happen at the same time; to be the same","cn":"同时发生；相符","ex":"The launch coincided with the holiday."},{"w":"constitute","ipa":"/ˈkɑːnstɪtuːt/","pos":"v.","en":"to be the parts that together form something","cn":"构成","ex":"Women constitute 70% of the audience."},{"w":"differentiate"
