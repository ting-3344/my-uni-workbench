m","cn":"漏洞；缺陷","ex":"We fixed a major bug today."},{"w":"debug","ipa":"/diːˈbʌɡ/","pos":"v.","en":"to find and remove errors","cn":"调试","ex":"I spent hours debugging."},{"w":"syntax","ipa":"/ˈsɪntæks/","pos":"n.","en":"the rules for writing code","cn":"语法","ex":"A syntax error stopped the build."},{"w":"variable","ipa":"/ˈveriəbl/","pos":"n.","en":"a named storage for a value","cn":"变量","ex":"Set a variable for the count."},{"w":"function","ipa":"/ˈfʌŋkʃn/","pos":"n.","en":"a block of code that does a task","cn":"函数","ex":"Write a function to format dates."},{"w":"array","ipa":"/əˈreɪ/","pos":"n.","en":"an ordered list of values","cn":"数组","ex":"Loop through the array."},{"w":"render","ipa":"/ˈrendər/","pos":"v.","en":"to draw or produce on screen","cn":"渲染；呈现","ex":"The page renders in milliseconds."},{"w":"automation","ipa":"/ˌɔːtəˈmeɪʃn/","pos":"n.","en":"doing tasks automatically by machine","cn":"自动化","ex":"Automation saved us hours."},{"w":"dataset","ipa":"/ˈdeɪtəset/","pos":"n.","en":"a collection of data for analysis","cn":"数据集","ex":"The dataset has ten thousand rows."},{"w":"model","ipa":"/ˈmɑːdl/","pos":"n.","en":"a system that learns patterns from data","cn":"模型","ex":"We trained the model on past posts."},{"w":"inference","ipa":"/ˈɪnfərəns/","pos":"n.","en":"using a trained model to predict","cn":"推理；推断","ex":"Inference runs on the user device."},{"w":"prompt","ipa":"/prɑːmpt/","pos":"n.","en":"the text you give an AI to act on","cn":"提示词","ex":"A clear prompt gets a better answer."},{"w":"token","ipa":"/ˈtoʊkən/","pos":"n.","en":"a unit of text an AI processes","cn":"token；令牌","ex":"The reply used two thousand tokens."}]},"SPEAKING":[{"id":"sp_nce2_guide","title":"新概念英语 2 · 学习路线（自备教材文本）","level":"入门→中级","src":"教材配套","kind":"课程指引","desc":"每天 1~2 课。流程：① 听录音不看书 ② 逐句跟读 ③ 看文本朗读 ④ 合上书复述 ⑤ 默写关键句。","lessons":["L1 A Private Conversation","L2 Breakfast or Lunch?","L3 Please Send Me a Card","L4 An Exciting Trip","L5 No Wrong Numbers","L6 Percy Buttons","L7 Too Late","L8 The Best and the Worst","L9 A Cold Welcome","L10 Not for Jazz"],"text":"A private conversation.\nLast week I went to the theatre.\nI had a very good seat.\nThe play was very interesting.\nI did not enjoy it.\nA young man and a young woman were sitting behind me.\nThey were talking loudly.\nI got very angry.\nI could not hear the actors.\nI turned round.\nI looked at the man and the woman angrily.\nThey did not pay any attention.","tip":"新概念完整课文受版权保护，此处仅为节奏演示。请把你手上教材的课文粘贴进「跟读工作台」使用全部功能。"},{"id":"sp_us_daily","title":"《走进美国》· 日常场景常用句型 30 条","level":"中级","src":"自建句型库","kind":"句型积累","desc":"按场景积累，每条都练到脱口而出。建议每天吃透 5 条并造 2 个自己的句子。","text":"How's it going? — Pretty good, how about you?\nI was just about to call you.\nDo you mind if I sit here?\nI'm not really into horror movies.\nThat works for me.\nLet me get back to you on that.\nI totally get what you mean.\nIt's not a big deal.\nI'm running a little late.\nCould you give me a hand with this?\nI'd rather stay in tonight.\nIt kind of depends on the weather.\nI'm still getting used to it.\nThat's exactly what I was thinking.\nI'll take care of it.\nDo you want to grab a coffee?\nI'm swamped with work right now.\nMy bad, I completely forgot.\nLong story short, we missed the train.\nI'm just gonna wing it.\nThat makes sense.\nI've been meaning to ask you something.\nIt slipped my mind.\nLet's play it by ear.\nI'm on my way.\nWhat are you up to this weekend?\nI could use some help here.\nHonestly, I have mixed feelings about it.\nThat's a good point, but I'd say the opposite.\nI'll keep that in mind."},{"id":"sp_interview_en","title":"英文面试高频问答（外企 / 央企涉外岗）","level":"进阶","src":"自建","kind":"求职专用","desc":"把自我介绍练到 60 秒无卡顿。录音回听，重点听：语速、停顿、词尾辅音。","text":"Could you tell me a little about yourself?\nI'm a senior student majoring in business administration.\nOver the past year, I built a lifestyle account from zero to twenty thousand followers.\nWhat I enjoy most is turning messy information into a clear plan that people can actually follow.\nWhy are you interested in this position?\nI've been following your company's content strategy for months.\nWhat impressed me was how you turned a traditional brand into something young people talk about.\nWhat would you say is your biggest weakness?\nI used to spend too long polishing details before publishing.\nI now set a hard deadline and ship the first version, then improve it based on data.\nWhere do you see yourself in five years?\nI hope to grow into someone who owns a full content line, from strategy to execution to review."},{"id":"sp_shadow_news","title":"影子跟读 · 新闻播报节奏训练","level":"进阶","src":"自建","kind":"语流训练","desc":"不追求听懂，只追求跟上。落后原声 0.5~1 秒开口，重点模仿重音位置和停顿。","text":"Good evening, and welcome to the program.\nOur top story tonight: researchers have released a new report on sleep and learning.\nThe study followed more than two thousand students over three years.\nIt found that those who kept a regular sleep schedule performed significantly better on memory tests.\nThe lead author says the timing matters as much as the total hours.\nWe'll have more on that story after the break."},{"id":"sp_campus","title":"校园生活口语 20 条","level":"入门→中级","src":"自建","kind":"场景积累","desc":"同学间最常用的表达，先练到能脱口而出，再套自己的事。","text":"Could you explain that part again?\nI'm completely swamped with assignments this week.\nLet's form a study group for the final exam.\nThe library is open twenty-four hours during exam week.\nI aced the presentation, but the paper was tougher.\nDo you want to grab lunch after class?\nI'm thinking about joining the student union.\nThe professor moved the deadline to next Friday.\nI couldn't catch the main point of the lecture.\nCan I borrow your notes from Tuesday's class?\nWe should probably start preparing a month in advance.\nThe group project really improved my teamwork.\nI'm running low on sleep these days.\nHave you decided on your graduation thesis topic?\nHonestly, the online course is more flexible.\nLet's review the key concepts before the quiz.\nI'm aiming for a distinction this semester.\nThe campus career fair is next Tuesday.\nCould you proofread my personal statement?\nI feel way more confident after practicing."},{"id":"sp_work","title":"职场沟通高频 20 条","level":"中级","src":"自建","kind":"求职专用","desc":"实习 / 外企 / 会议场景真用得上的短句，练到不卡壳。","text":"Let's sync on this tomorrow morning.\nCould you send me the deck before the meeting?\nI'll circle back to you by end of day.\nJust to clarify, are we shipping on Friday?\nThanks for the quick turnaround.\nI took the liberty of drafting a first version.\nLet's align on the priorities first.\nDo you have bandwidth to take this on?\nI'll loop in the design team.\nCan we move the deadline two days?\nThe numbers look solid, but the conclusion is weak.\nI'd push back on that assumption.\nLet's table this and revisit next week.\nGreat job on the launch, everyone.\nCould you walk me through the rationale?\nWe need a clearer call to action.\nThe feedback from users was mostly positive.\nI'll own the reporting side of this.\nLet's keep the scope tight for version one.\nCan you confirm the final version is live?"},{"id":"sp_travel","title":"旅行与日常口语 20 条","level":"入门→中级","src":"自建","kind":"场景积累","desc":"出门在外、点单问路、购物付款都用得上。","text":"Could you recommend a local restaurant?\nIs there a subway station near here?\nI'd like a window seat, please.\nHow long does the transfer take?\nDo you have this in a larger size?\nCan I get a receipt, please?\nThe weather forecast says it might rain.\nLet's split the bill.\nI'm looking for the nearest pharmacy.\nCould you take a photo of us?\nThe queue is moving pretty fast.\nI lost my way, can you help me?\nWhat time does the museum close?\nI'd prefer something not too spicy.\nDo you accept mobile payment?\nThe view from here is absolutely stunning.\nLet's leave earlier to avoid traffic.\nI forgot to bring a charger.\nIs breakfast included in the price?\nThis place is way more lively at night."},{"id":"sp_emo","title":"情绪与观点表达 15 条","level":"中级","src":"自建","kind":"语感积累","desc":"表达感受、态度、立场，让口语自然有温度。","text":"I'm a bit overwhelmed lately.\nTo be honest, I'm on the fence about it.\nThat's easier said than done.\nI couldn't agree more.\nI see your point, but I have reservations.\nIt really gets on my nerves when meetings run late.\nI'm thrilled about the news.\nThat took a weight off my shoulders.\nI'm not a big fan of crowded places.\nFrankly, it's not worth the effort.\nI'm torn between two options.\nIt brightens my day when someone says thanks.\nI feel a bit under the weather today.\nLet's look on the bright side.\nThat comment really warmed my heart."},{"id":"sp_ielts1","title":"雅思口语 Part 1 常见题 15 条","level":"中高级","src":"自建","kind":"考试向","desc":"用这些回答模板练流畅度，替换加粗信息即可套用。","text":"I live in a bustling city with great public transport.\nMy favorite season is autumn because the weather is mild.\nI'm into photography in my spare time.\nI usually unwind by taking a long walk.\nThe best part of my day is the morning coffee.\nI prefer texting to calling, to be honest.\nI keep fit by doing yoga twice a week.\nMy hometown is famous for its street food.\nI'm a morning person, so I get most done before noon.\nReading helps me relax after a busy day.\nI celebrate my birthday with close friends.\nI enjoy documentaries about nature.\nWeekends are for recharging, not for overtime.\nI'm saving up for a trip next summer.\nMusic is a big part of my daily routine."},{"id":"sp_tech_news","title":"影子跟读 · 科技新闻（AI 摘要）","level":"进阶","src":"自建","kind":"语流训练","desc":"不追求听懂，只追求跟上。落后原声 0.5~1 秒开口，重点模仿重音位置。","text":"Good morning, and thanks for joining us.\nIn today's tech briefing, a major social platform announced a new tool that turns long articles into short video summaries.\nThe company says the feature uses artificial intelligence to keep the original meaning.\nEarly users reported saving nearly half the time they usually spend reading.\nCritics warn that short summaries may leave out important context.\nThe firm promised clearer labels on AI-generated content.\nWe'll continue to follow this story as more details emerge."},{"id":"sp_d_order_food","title":"餐厅点餐全场景","level":"中级","src":"自建","kind":"场景积累","desc":"进店→点单→特殊要求→结账，全套走一遍，吃到国外也不慌。","text":"Could we have a table for two, please?\nI'd like to see the menu first.\nWhat do you recommend for today's special?\nI'll have the grilled chicken salad, please.\nCould I get that without onions?\nAnd a glass of sparkling water, no ice.\nIs the soup served with bread?\nCould we get a couple of extra napkins?\nThat was delicious, thank you.\nCould we have the bill, please?\nCan I pay by mobile, or is it cash only?\nKeep the change, it's for the server."},{"id":"sp_d_shopping","title":"购物与退换实战","level":"中级","src":"自建","kind":"场景积累","desc":"试穿、砍价、退换货，把这几句练到脱口而出。","text":"Excuse me, where can I find the fitting room?\nDo you have this in a smaller size?\nThis one feels a bit tight around the shoulders.\nIs there any discount if I buy two?\nI'd like to return this, it doesn't fit.\nDo you have the receipt on file?\nCan I get a store credit instead of cash?\nThe zipper broke after one wear.\nCould you check if it's still in warranty?\nI'll think about it and come back later."},{"id":"sp_d_phonecall","title":"电话预约与改期","level":"入门→中级","src":"自建","kind":"场景积累","desc":"预约、确认、改期，电话里也能说得清楚。","text":"Hi, I'd like to make an appointment for tomorrow.\nWhat time slots do you have available?\nDoes that include a consultation fee?\nCould you put me down for 3 p.m.?\nI'm calling to confirm my booking.\nI'm afraid I need to reschedule.\nWould 4 p.m. work instead?\nCould you spell your name for me?\nI'll receive a reminder by text, right?\nThank you, that's very helpful."},{"id":"sp_d_ask_way","title":"问路与地面交通","level":"入门→中级","src":"自建","kind":"场景积累","desc":"陌生城市靠这几句就能自己走。","text":"Excuse me, is the subway station nearby?\nWhich exit should I take for the museum?\nHow long does it take to walk there?\nCould you show me on the map?\nIs there a direct bus to the old town?\nDo I need to transfer along the way?\nThe GPS says to turn left here.\nAm I going the right direction?\nHow much is a single ticket?\nThanks a lot, you saved me."},{"id":"sp_d_doctor","title":"看病就医沟通","level":"中级","src":"自建","kind":"场景积累","desc":"说清症状、听懂医嘱，在国外看病必备。","text":"I've had a sore throat since yesterday.\nI think I might be running a fever.\nDo I need to see a specialist?\nHow often should I take this medicine?\nAre there any side effects?\nShould I avoid certain foods?\nCan you write a sick note for work?\nWhen should I come back for a check-up?\nThe pain hasn't gone down yet.\nCall me if the results are abnormal."},{"id":"sp_d_bank","title":"银行开户与换汇","level":"中级","src":"自建","kind":"场景积累","desc":"办卡、绑卡、换汇、打流水，都在这里。","text":"I'd like to open a savings account.\nWhat documents do I need to bring?\nIs there a monthly service fee?\nCan I link it to my mobile wallet?\nWhat's the daily withdrawal limit?\nHow do I reset my online banking password?\nI'd like to exchange some foreign currency.\nWhat's today's exchange rate?\nCould you print a mini statement?\nThank you for your patience."},{"id":"sp_d_smalltalk","title":"寒暄破冰 10 句","level":"入门→中级","src":"自建","kind":"场景积累","desc":"认识新朋友、聊天的开场白。","text":"So, what brings you here today?\nHave we met at the workshop before?\nI love your backpack, where's it from?\nWhat do you usually do on weekends?\nI'm into hiking when the weather's nice.\nSmall world, I'm from the same city!\nHave you tried the coffee downstairs?\nWhat are you reading these days?\nI didn't catch your name, sorry.\nAnyway, great talking with you."},{"id":"sp_d_invite","title":"邀请与赴约","level":"中级","src":"自建","kind":"场景积累","desc":"约饭、约玩、婉拒、改期，社交刚需。","text":"We're having a few friends over Saturday.\nWould you like to join us for dinner?\nDo you have any dietary restrictions?\nI can pick you up around seven.\nBring whoever you like, the more the merrier.\nLet me know if you can make it.\nSadly I'm booked that evening.\nRain check? Maybe next week?\nThanks for the invite, I'd love to.\nI'll save you a seat."},{"id":"sp_d_complaint","title":"投诉与售后","level":"中高级","src":"自建","kind":"场景积累","desc":"东西不对、没收到，有理有据地维权。","text":"I'm calling about an order that never arrived.\nThe item I received is the wrong color.\nI'd like a full refund, please.\nThis is the third time it's happened.\nCan you escalate this to a manager?\nI have photos as proof.\nWhen can I expect a response?\nYour service used to be better.\nI'd appreciate a discount for the trouble.\nLet's settle this fairly."},{"id":"sp_d_apology","title":"道歉与原谅","level":"中级","src":"自建","kind":"语感积累","desc":"真诚道歉、大方原谅，关系更稳。","text":"I'm really sorry about the mix-up.\nIt was completely my fault.\nPlease accept my apology.\nI should have double-checked.\nWon't happen again, I promise.\nNo hard feelings, okay?\nThanks for being understanding.\nI owe you one.\nLet's move past it.\nApology accepted, don't worry."},{"id":"sp_c_library","title":"图书馆借还书","level":"中级","src":"自建","kind":"校园","desc":"借书、续借、找书、打印，校园日常。","text":"Hi, I'd like to borrow this book.\nHow many books can I check out at once?\nWhen is it due back?\nCan I renew it online?\nIs there a quiet study room available?\nThe printer in the corner is jammed.\nDo you have the latest edition of this textbook?\nI left my notebook at a desk, have you seen it?\nCould you show me how to use the catalogue?\nThe Wi-Fi here is pretty fast, right?"},{"id":"sp_c_group","title":"小组作业协作","level":"中级","src":"自建","kind":"校园","desc":"分工、同步、赶进度，小组作业全靠它。","text":"Let's divide the work by next Tuesday.\nI'll take care of the data analysis.\nCould you draft the introduction first?\nWe should sync twice a week.\nThe slides need to be simpler.\nWho's presenting on Friday?\nLet's meet at the library at three.\nI'll share the doc so we can edit together.\nWe're behind schedule, pick up the pace.\nGreat job, that's a solid first draft."},{"id":"sp_c_exam","title":"备考互相抽背","level":"中级","src":"自建","kind":"校园","desc":"和同学对练，把知识说出口才记得住。","text":"How are you preparing for the finals?\nI made flashcards for the key terms.\nWant to do a mock test together?\nThe past papers really help.\nI keep mixing up these two concepts.\nLet's quiz each other tonight.\nDon't cram, sleep is more useful now.\nI'll explain it with an example.\nThe essay counts for half the grade.\nWe've got this, just stay calm."},{"id":"sp_c_club","title":"社团招新与加入","level":"中级","src":"自建","kind":"校园","desc":"认识同好、加入组织，丰富简历。","text":"What kind of activities does your club run?\nI'm interested in joining the photography club.\nIs there a membership fee?\nHow often do you meet?\nDo I need any prior experience?\nWe're recruiting new editors this term.\nYou can just show up at the next session.\nIt's a great way to meet people.\nSign up here with your student ID.\nWelcome aboard, see you Thursday!"},{"id":"sp_c_prof","title":"找导师 / Office Hour","level":"中高级","src":"自建","kind":"校园","desc":"主动找老师、问方向、要反馈。","text":"Professor, could I talk about my thesis?\nDo you have office hours this week?\nI'm stuck on the literature review.\nCould you point me to some readings?\nI'd like your feedback on my draft.\nIs this research angle worth pursuing?\nWhen is the proposal due?\nMay I sit in on your seminar?\nThanks for the clear guidance.\nI'll revise and send it over."},{"id":"sp_c_graduate","title":"毕业论文进度沟通","level":"高级","src":"自建","kind":"校园","desc":"开题、写作、答辩前的常用表达。","text":"I finally finished my first chapter.\nThe methodology section is tricky.\nMy sample size feels too small.\nThe data supports my hypothesis.\nI need two more weeks to edit.\nThe citation format is driving me crazy.\nMy advisor suggested a case study.\nThe defense is scheduled for June.\nI'm both excited and terrified.\nOne more round of proofreading, then done."},{"id":"sp_w_meeting","title":"开会发言与控场","level":"中高级","src":"自建","kind":"求职专用","desc":"开会高频句，外企/大厂实习直接能用。","text":"Let's get started, everyone's here.\nQuick recap of last week's actions.\nI'll own the research part.\nCan we park that topic for later?\nTo summarize, here's the plan.\nAny objections before we lock it in?\nI'll circulate the notes after.\nLet's keep it to fifteen minutes.\nGood progress, keep it up.\nNext sync is Thursday, same time."},{"id":"sp_w_email","title":"职场邮件高频句","level":"中高级","src":"自建","kind":"求职专用","desc":"写邮件不卡壳，专业又利落。","text":"I'm writing to follow up on our chat.\nPlease find the report attached.\nCould you review by end of day?\nLooping in the finance team.\nApologies for the delayed reply.\nLet's take this offline.\nI've flagged the urgent items.\nConfirm receipt when you can.\nGreat, that works on my end.\nTalk soon, and thanks again."},{"id":"sp_w_feedback","title":"述职与 1on1","level":"高级","src":"自建","kind":"求职专用","desc":"讲产出、谈成长，向上管理就这么聊。","text":"Here's what I delivered this quarter.\nMy focus was improving retention.\nThe biggest win was the launch.\nOne area I want to grow is strategy.\nCould I get more ownership next time?\nI'd value candid feedback.\nThe timeline was tighter than expected.\nI learned to scope better.\nLet's set one clear goal for Q3.\nThanks for the support."},{"id":"sp_w_negotiate","title":"薪资与 offer 谈判","level":"高级","src":"自建","kind":"求职专用","desc":"秋招终面常考，练到不心虚。","text":"I'm excited about the offer.\nBased on the market, I was hoping for a bit more.\nCould we discuss the base salary?\nIs there flexibility on the signing bonus?\nI have another offer at a higher range.\nI'm confident I can deliver value fast.\nWhat does the review cycle look like?\nCould the title be adjusted?\nI appreciate your consideration.\nLet's proceed, I'm on board."},{"id":"sp_w_presentation","title":"工作汇报 / 路演","level":"高级","src":"自建","kind":"求职专用","desc":"讲结果、给建议，汇报结构一套带走。","text":"Today I'll walk you through the results.\nThe key insight is user retention.\nEngagement rose by twenty percent.\nWe tested two versions, B won.\nThe cost per click dropped sharply.\nNext, we scale the winning variant.\nRisks include seasonality.\nI recommend a phased rollout.\nHappy to take questions.\nThanks for your time."},{"id":"sp_w_customer","title":"客服应对话术","level":"中高级","src":"自建","kind":"求职专用","desc":"运营/客服岗面试与实习都常用。","text":"Thanks for reaching out, how can I help?\nI'm sorry to hear that, let's fix it.\nCould you share your order number?\nI'll look into this right away.\nWe'll send a replacement today.\nAs a gesture, here's a coupon.\nYour satisfaction matters to us.\nI've escalated this to the team.\nYou'll hear back within twenty-four hours.\nIs there anything else I can do?"},{"id":"sp_w_onboard","title":"新人入职融入","level":"中级","src":"自建","kind":"求职专用","desc":"刚入职怎么接话、怎么问，不露怯。","text":"Welcome to the team, glad you're here.\nYour laptop and accounts are ready.\nI'll be your buddy for the first month.\nHere's the onboarding doc.\nDon't hesitate to ask anything.\nOur standup is at nine thirty.\nShadow me on a couple of calls.\nThe wiki has most answers.\nWe ship every two weeks.\nExcited to see what you'll build."},{"id":"sp_w_resign","title":"离职与交接","level":"中高级","src":"自建","kind":"求职专用","desc":"体面离开，也是职业素养的一部分。","text":"I've decided to move on.\nI'll document everything I own.\nLet's schedule a handover.\nI'll train my replacement next week.\nThe password vault is shared.\nOpen tasks are in the tracker.\nThanks for the opportunities.\nI learned a ton here.\nKeep in touch, LinkedIn?\nWishing the team all the best."},{"id":"sp_t_hotel","title":"酒店入住与客房","level":"中级","src":"自建","kind":"旅行","desc":"订房、入住、提需求、退房。","text":"I have a reservation under Lee.\nCould I get a room with a city view?\nWhat time is checkout?\nIs breakfast included?\nThe air conditioning isn't working.\nCould we get extra pillows?\nWhere's the nearest elevator?\nCan I store my luggage after checkout?\nIs there a gym on site?\nThanks, the room is lovely."},{"id":"sp_t_airport","title":"机场值机与登机","level":"中级","src":"自建","kind":"旅行","desc":"值机、托运、转机、登机口。","text":"I'd like to check in for flight CA123.\nWindow or aisle, which do you prefer?\nCan I take this as carry-on?\nHow much is the overweight fee?\nWhere's the boarding gate?\nMy flight is delayed, right?\nHow long is the layover?\nDo I need a transit visa?\nCould you print my boarding pass?\nGate closes in twenty minutes, hurry."},{"id":"sp_t_lost","title":"物品遗失求助","level":"中高级","src":"自建","kind":"旅行","desc":"丢东西不慌，照着说就能找回。","text":"I think I left my bag on the train.\nCould you check the lost and found?\nIt's a black backpack with a tag.\nWhen did you last see it?\nI filed a report online already.\nHas anyone turned it in?\nCould you describe it for me?\nWe'll call if we find anything.\nThank you, I really appreciate it.\nHere's my contact number."},{"id":"sp_t_food","title":"异国餐厅点餐","level":"中级","src":"自建","kind":"旅行","desc":"过敏、辣度、买单，吃得安心。","text":"What's the local specialty?\nIs this dish very spicy?\nCould you make it mild, please?\nI'm allergic to nuts.\nA glass of the house red, please.\nCould we get the bill separately?\nThat was the best meal so far.\nDo you accept contactless payment?\nWhere's a good spot for dessert?\nThanks for the recommendation."},{"id":"sp_t_transport","title":"当地交通出行","level":"中级","src":"自建","kind":"旅行","desc":"买票、问路、打车、步行。","text":"Where can I buy a transit pass?\nDoes this bus go to the beach?\nHow many stops to the center?\nCan I tap my phone to ride?\nIs the night service running?\nCould the driver let me know when to get off?\nIs it safe to walk back?\nRent a bike by the hour?\nThe app says a car will arrive in three minutes.\nThanks, that was a smooth ride."},{"id":"sp_t_shopping","title":"免税店与伴手礼","level":"中级","src":"自建","kind":"旅行","desc":"免税、送礼、退换，买得明白。","text":"Are these prices tax-free?\nCan I see the duty-free allowance?\nDo you have this in a gift box?\nIs there a limit per person?\nCould I try the fragrance on?\nThe blue one is for my sister.\nCan you wrap it together?\nWhat's the return policy abroad?\nI'll take two of these.\nPlease keep the receipt."},{"id":"sp_e_agree","title":"赞同与反驳","level":"中高级","src":"自建","kind":"语感积累","desc":"讨论里有礼有节地表达立场。","text":"I couldn't agree more.\nThat's a fair point.\nI see where you're coming from.\nOn the other hand, consider the cost.\nI'm not entirely convinced.\nLet's agree to disagree.\nYou've changed my mind, actually.\nThat's not quite how I see it.\nFair enough, but the risk is real.\nI'm with you on the goal."},{"id":"sp_e_persuade","title":"说服他人","level":"高级","src":"自建","kind":"语感积累","desc":"用逻辑和共情把人说服。","text":"Hear me out for a second.\nThe data actually supports this.\nIt's a small change with big upside.\nWhat if we tried it for a week?\nThe cost is lower than you think.\nOthers have seen great results.\nWorst case, we revert it.\nI'll take the first step.\nTrust me, it's worth a shot.\nShall we give it a go?"},{"id":"sp_e_comfort","title":"安慰朋友","level":"中高级","src":"自建","kind":"语感积累","desc":"把关心说到位，关系更近。","text":"I'm really sorry you're going through this.\nThat sounds incredibly tough.\nTake all the time you need.\nI'm here for you, no matter what.\nIt's okay to not be okay.\nYou've handled worse before.\nWant to talk it through?\nLet's grab a coffee later.\nThings will get better, I promise.\nYou're stronger than you think."},{"id":"sp_e_excite","title":"表达激动与开心","level":"中级","src":"自建","kind":"语感积累","desc":"分享好消息时更有感染力。","text":"I'm so pumped about this!\nThis is literally a dream come true.\nI can't believe it actually happened.\nBest news I've had all year.\nI'm over the moon right now.\nWe did it, all of us!\nThis calls for a celebration.\nI'm grinning like an idiot.\nThank you for making this possible.\nI'm still shaking, honestly."},{"id":"sp_e_disappoint","title":"表达失望","level":"中高级","src":"自建","kind":"语感积累","desc":"得体地表达失落，不抱怨。","text":"I was really looking forward to it.\nHonestly, I'm a bit let down.\nIt didn't turn out as hoped.\nI won't lie, I'm disappointed.\nWe were so close, too.\nMaybe next time, I guess.\nIt's a shame it fell through.\nI expected a bit more, to be frank.\nLet's learn from it and move on.\nTomorrow's a fresh start."},{"id":"sp_e_uncertain","title":"表达不确定","level":"中高级","src":"自建","kind":"语感积累","desc":"不瞎承诺，留有余地。","text":"I'm not a hundred percent sure.\nIt's hard to say at this point.\nMy gut says probably not.\nDon't quote me on this.\nThe picture isn't clear yet.\nI'll confirm and get back to you.\nIt could go either way.\nWe'll know more next week.\nI'd rather not speculate.\nLet's wait for the official word."},{"id":"sp_x_ielts2","title":"雅思 Part 2 个人长回答","level":"中高级","src":"自建","kind":"考试向","desc":"2 分钟独白框架，替换信息即可套用。","text":"I'd like to talk about a person who inspired me.\nShe was my high school English teacher.\nWhat I admire most is her patience.\nI remember one lesson that changed me.\nShe always encouraged us to speak up.\nThat experience shaped who I am.\nIf I met her today, I'd say thank you.\nI think good teachers are unforgettable.\nThis memory still makes me smile.\nTo sum up, she truly made a difference."},{"id":"sp_x_ielts3","title":"雅思 Part 3 深度讨论","level":"高级","src":"自建","kind":"考试向","desc":"抽象问题怎么展开，练逻辑。","text":"Why do people enjoy learning from others?\nI think role models make goals feel real.\nHow has education changed recently?\nTechnology has made it far more accessible.\nShould schools teach life skills?\nAbsolutely, exams aren't the whole of life.\nWhat makes a good learner?\nCuriosity and consistency, I'd say.\nDo you think grades matter?\nThey matter less than real understanding."},{"id":"sp_x_toefl","title":"托福独立口语框架","level":"高级","src":"自建","kind":"考试向","desc":"给观点+理由+例子，标准结构。","text":"Some people prefer to work in teams.\nI tend to agree with that view.\nWorking alone gives you full control.\nBut teams bring diverse ideas.\nIn my experience, a mix works best.\nFor creative tasks, I like solitude.\nFor big projects, collaboration wins.\nIt also depends on the deadline.\nEither way, communication is key.\nThat's why I adapt to the situation."},{"id":"sp_x_story","title":"个人经历讲述（作品集向）","level":"中高级","src":"自建","kind":"考试向","desc":"讲清「我做过什么、学到什么」，面试也用得上。","text":"Let me tell you about a small win.\nLast month I posted my first video.\nI was nervous it would flop.\nTurns out people loved the honesty.\nIt reached ten thousand views overnight.\nI replied to every single comment.\nThat taught me to ship before perfect.\nNow I post weekly without fear.\nThe numbers matter less than the habit.\nConsistency really is a superpower."},{"id":"sp_s_ted","title":"影子跟读 · TED 开场","level":"进阶","src":"自建","kind":"语流训练","desc":"不追求听懂，只追着重音和停顿。","text":"Good morning, everyone, and thank you for being here.\nThe idea I want to share started with a question.\nWhat if the way we learn is backwards?\nFor years we believed practice makes perfect.\nBut research tells a more interesting story.\nLet me show you what I mean.\nHere is a simple example from everyday life.\nNotice how small changes add up.\nI'll walk you through three steps.\nAnd by the end, you'll try one yourself."},{"id":"sp_s_podcast","title":"影子跟读 · 播客片段","level":"进阶","src":"自建","kind":"语流训练","desc":"连读弱读密集，练耳朵首选。","text":"Welcome back to the show, this is your host.\nToday we're talking about building habits.\nMost people start strong and then fade.\nThe trick is to make it almost too easy.\nTwo minutes is better than nothing.\nStack the new habit onto an old one.\nThat's called habit stacking, by the way.\nIt sounds simple, and that's the point.\nWe'll take a quick break, be right back.\nThanks for listening, more after this."},{"id":"sp_s_story","title":"短文朗读 · 睡前故事风","level":"中级","src":"自建","kind":"语流训练","desc":"节奏舒缓，适合放松时跟读。","text":"Once upon a time, there was a small blue boat.\nIt sailed across a quiet silver lake.\nThe wind was gentle, the stars were bright.\nA friendly moon watched from the sky.\nThe boat hummed a little song of home.\nIt met a duck who paddled by to say hello.\nThey shared a story till the night grew late.\nThen the boat drifted softly back to shore.\nIt closed its eyes and dreamed of the sea.\nAnd the lake whispered, sleep well, little boat."},{"id":"sp_s_speech","title":"影子跟读 · 毕业演讲","level":"进阶","src":"自建","kind":"语流训练","desc":"正式语体，练气势和停顿。","text":"Class of this year, look at how far you've come.\nFour years ago, you walked in with a question.\nToday, you leave with a voice of your own.\nYou will fail, and that is not the end.\nFailure is simply data for the next try.\nBe kind, be curious, be impossibly yourself.\nThe world needs what only you can offer.\nSo go, and build something that matters.\nWe are proud of you, every single one.\nNow close your laptop, and open your life."},{"id":"sp_s_news2","title":"影子跟读 · 财经新闻","level":"进阶","src":"自建","kind":"语流训练","desc":"数字和术语密集，练信息抓取。","text":"Markets opened higher this morning on strong earnings.\nTech shares led the gains across the board.\nThe central bank held interest rates steady.\nAnalysts expect growth to slow next quarter.\nInflation eased for a second month in a row.\nConsumer spending remained surprisingly resilient.\nThe currency firmed against the dollar.\nInvestors are watching the jobs report closely.\nWe'll have full coverage on the nightly news.\nThat's your market update for today."},{"id":"sp_s_interview","title":"影子跟读 · 名人访谈","level":"进阶","src":"自建","kind":"语流训练","desc":"自然口语节奏，学怎么把话说自然。","text":"So tell me, what got you started in this field?\nHonestly, I just followed a thing I loved.\nThere were a lot of nights I wanted to quit.\nBut I kept showing up, and things shifted.\nThe biggest lesson was to stay close to users.\nWe almost ran out of money in year two.\nWhat saved us was listening, not guessing.\nNow I tell young founders, ship and learn.\nFear is just excitement without the breath.\nIf you're bored, you're probably on the right path."},{"id":"sp_s_commercial","title":"影子跟读 · 广告配音","level":"中级","src":"自建","kind":"语流训练","desc":"短句有力，练语调和重音。","text":"Meet the phone that thinks with you.\nOne tap, and your day just flows.\nCapture the moment before it fades.\nBuilt for the way you really live.\nLess charging, more doing.\nDesigned to disappear in your hand.\nBecause your time is yours.\nSmall package, serious power.\nThis is not just new, it's next.\nStart your story today."},{"id":"sp_s_weather","title":"影子跟读 · 天气预报","level":"入门→中级","src":"自建","kind":"语流训练","desc":"句式重复，适合入门跟读。","text":"Here's your weather for the weekend.\nSaturday will be sunny and warm.\nA light breeze from the east, around twenty-four degrees.\nSunday brings a few passing showers.\nDon't forget an umbrella in the afternoon.\nMonday turns cooler with a fresh wind.\nOverall, a mixed but pleasant few days.\nVisibility is good across the region.\nSunrise is at six twelve, sunset at six forty.\nThat's your forecast, have a great weekend."}],"LISTENING":[{"cat":"新闻","name":"BBC Learning English · 6 Minute English","level":"中级","acc":"英音","url":"https://www.bbc.co.uk/learningenglish","desc":"6 分钟一期，带文本，适合精听起步","tip":"先盲听 2 遍 → 看文本 → 逐句跟读 → 复述大意"},{"cat":"新闻","name":"NPR News Now","level":"中高级","acc":"美音","url":"https://www.npr.org/podcasts/500005/npr-news-now","desc":"5 分钟美音新闻，每小时更新","tip":"美音新闻首选，语速偏快，练耳朵最有效"},{"cat":"新闻","name":"VOA Learning English","level":"入门","acc":"美音","url":"https://learningenglish.voanews.com","desc":"慢速 + 常速，带全文","tip":"零基础从慢速开始，两周后切常速"},{"cat":"演讲","name":"TED Talks Daily","level":"中高级","acc":"混合","url":"https://www.ted.com/talks","desc":"带双语字幕，话题广","tip":"挑 8~12 分钟的，做「一句一停」精听"},{"cat":"演讲","name":"TED-Ed","level":"中级","acc":"美音","url":"https://ed.ted.com","desc":"4~6 分钟动画科普，发音标准清晰","tip":"最适合当每日精听素材，长度刚好"},{"cat":"美剧","name":"《小谢尔顿》Young Sheldon","level":"中级","acc":"美音（德州口音）","url":"https://www.bilibili.com/","desc":"生活场景多，句子短，语速适中","tip":"第一季最友好。每集挑 3 分钟做无字幕精听"},{"cat":"美剧","name":"《老友记》Friends","level":"中级","acc":"标准美音","url":"https://www.bilibili.com/","desc":"口语教科书，俚语多","tip":"经典练法：一集刷 5 遍（盲听→字幕→跟读→配音→复述）"},{"cat":"美剧","name":"《绝望主妇》Desperate Housewives","level":"中高级","acc":"标准美音","url":"https://www.bilibili.com/","desc":"旁白部分是极佳的朗读素材","tip":"每集开头结尾的旁白，背下来对写作也有帮助"},{"  {"w": "array", "ipa": "/əˈreɪ/", "pos": "n.", "en": "an ordered list of values", "cn": "数组", "ex": "Loop through the array."}, {"w": "render", "ipa": "/ˈrendər/", "pos": "v.", "en": "to draw or produce on screen", "cn": "渲染；呈现", "ex": "The page renders in milliseconds."}, {"w": "automation", "ipa": "/ˌɔːtəˈmeɪʃn/", "pos": "n.", "en": "doing tasks automatically by machine", "cn": "自动化", "ex": "Automation saved us hours."}, {"w": "dataset", "ipa": "/ˈdeɪtəset/", "pos": "n.", "en": "a collection of data for analysis", "cn": "数据集", "ex": "The dataset has ten thousand rows."}, {"w": "model", "ipa": "/ˈmɑːdl/", "pos": "n.", "en": "a system that learns patterns from data", "cn": "模型", "ex": "We trained the model on past posts."}, {"w": "inference", "ipa": "/ˈɪnfərəns/", "pos": "n.", "en": "using a trained model to predict", "cn": "推理；推断", "ex": "Inference runs on the user device."}, {"w": "prompt", "ipa": "/prɑːmpt/", "pos": "n.", "en": "the text you give an AI to act on", "cn": "提示词", "ex": "A clear prompt gets a better answer."}, {"w": "token", "ipa": "/ˈtoʊkən/", "pos": "n.", "en": "a unit of text an AI processes", "cn": "token；令牌", "ex": "The reply used two thousand tokens."}]}, "SPEAKING": [{"id": "sp_nce2_guide", "title": "新概念英语 2 · 学习路线（自备教材文本）", "level": "入门→中级", "src": "教材配套", "kind": "课程指引", "desc": "每天 1~2 课。流程：① 听录音不看书 ② 逐句跟读 ③ 看文本朗读 ④ 合上书复述 ⑤ 默写关键句。", "lessons": ["L1 A Private Conversation", "L2 Breakfast or Lunch?", "L3 Please Send Me a Card", "L4 An Exciting Trip", "L5 No Wrong Numbers", "L6 Percy Buttons", "L7 Too Late", "L8 The Best and the Worst", "L9 A Cold Welcome", "L10 Not for Jazz"], "text": "A private conversation.\nLast week I went to the theatre.\nI had a very good seat.\nThe play was very interesting.\nI did not enjoy it.\nA young man and a young woman were sitting behind me.\nThey were talking loudly.\nI got very angry.\nI could not hear the actors.\nI turned round.\nI looked at the man and the woman angrily.\nThey did not pay any attention.", "tip": "新概念完整课文受版权保护，此处仅为节奏演示。请把你手上教材的课文粘贴进「跟读工作台」使用全部功能。"}, {"id": "sp_us_daily", "title": "《走进美国》· 日常场景常用句型 30 条", "level": "中级", "src": "自建句型库", "kind": "句型积累", "desc": "按场景积累，每条都练到脱口而出。建议每天吃透 5 条并造 2 个自己的句子。", "text": "How's it going? — Pretty good, how about you?\nI was just about to call you.\nDo you mind if I sit here?\nI'm not really into horror movies.\nThat works for me.\nLet me get back to you on that.\nI totally get what you mean.\nIt's not a big deal.\nI'm running a little late.\nCould you give me a hand with this?\nI'd rather stay in tonight.\nIt kind of depends on the weather.\nI'm still getting used to it.\nThat's exactly what I was thinking.\nI'll take care of it.\nDo you want to grab a coffee?\nI'm swamped with work right now.\nMy bad, I completely forgot.\nLong story short, we missed the train.\nI'm just gonna wing it.\nThat makes sense.\nI've been meaning to ask you something.\nIt slipped my mind.\nLet's play it by ear.\nI'm on my way.\nWhat are you up to this weekend?\nI could use some help here.\nHonestly, I have mixed feelings about it.\nThat's a good point, but I'd say the opposite.\nI'll keep that in mind."}, {"id": "sp_interview_en", "title": "英文面试高频问答（外企 / 央企涉外岗）", "level": "进阶", "src": "自建", "kind": "求职专用", "desc": "把自我介绍练到 60 秒无卡顿。录音回听，重点听：语速、停顿、词尾辅音。", "text": "Could you tell me a little about yourself?\nI'm a senior student majoring in business administration.\nOver the past year, I built a lifestyle account from zero to twenty thousand followers.\nWhat I enjoy most is turning messy information into a clear plan that people can actually follow.\nWhy are you interested in this position?\nI've been following your company's content strategy for months.\nWhat impressed me was how you turned a traditional brand into something young people talk about.\nWhat would you say is your biggest weakness?\nI used to spend too long polishing details before publishing.\nI now set a hard deadline and ship the first version, then improve it based on data.\nWhere do you see yourself in five years?\nI hope to grow into someone who owns a full content line, from strategy to execution to review."}, {"id": "sp_shadow_news", "title": "影子跟读 · 新闻播报节奏训练", "level": "进阶", "src": "自建", "kind": "语流训练", "desc": "不追求听懂，只追求跟上。落后原声 0.5~1 秒开口，重点模仿重音位置和停顿。", "text": "Good evening, and welcome to the program.\nOur top story tonight: researchers have released a new report on sleep and learning.\nThe study followed more than two thousand students over three years.\nIt found that those who kept a regular sleep schedule performed significantly better on memory tests.\nThe lead author says the timing matters as much as the total hours.\nWe'll have more on that story after the break."}, {"id": "sp_campus", "title": "校园生活口语 20 条", "level": "入门→中级", "src": "自建", "kind": "场景积累", "desc": "同学间最常用的表达，先练到能脱口而出，再套自己的事。", "text": "Could you explain that part again?\nI'm completely swamped with assignments this week.\nLet's form a study group for the final exam.\nThe library is open twenty-four hours during exam week.\nI aced the presentation, but the paper was tougher.\nDo you want to grab lunch after class?\nI'm thinking about joining the student union.\nThe professor moved the deadline to next Friday.\nI couldn't catch the main point of the lecture.\nCan I borrow your notes from Tuesday's class?\nWe should probably start preparing a month in advance.\nThe group project really improved my teamwork.\nI'm running low on sleep these days.\nHave you decided on your graduation thesis topic?\nHonestly, the online course is more flexible.\nLet's review the key concepts before the quiz.\nI'm aiming for a distinction this semester.\nThe campus career fair is next Tuesday.\nCould you proofread my personal statement?\nI feel way more confident after practicing."}, {"id": "sp_work", "title": "职场沟通高频 20 条", "level": "中级", "src": "自建", "kind": "求职专用", "desc": "实习 / 外企 / 会议场景真用得上的短句，练到不卡壳。", "text": "Let's sync on this tomorrow morning.\nCould you send me the deck before the meeting?\nI'll circle back to you by end of day.\nJust to clarify, are we shipping on Friday?\nThanks for the quick turnaround.\nI took the liberty of drafting a first version.\nLet's align on the priorities first.\nDo you have bandwidth to take this on?\nI'll loop in the design team.\nCan we move the deadline two days?\nThe numbers look solid, but the conclusion is weak.\nI'd push back on that assumption.\nLet's table this and revisit next week.\nGreat job on the launch, everyone.\nCould you walk me through the rationale?\nWe need a clearer call to action.\nThe feedback from users was mostly positive.\nI'll own the reporting side of this.\nLet's keep the scope tight for version one.\nCan you confirm the final version is live?"}, {"id": "sp_travel", "title": "旅行与日常口语 20 条", "level": "入门→中级", "src": "自建", "kind": "场景积累", "desc": "出门在外、点单问路、购物付款都用得上。", "text": "Could you recommend a local restaurant?\nIs there a subway station near here?\nI'd like a window seat, please.\nHow long does the transfer take?\nDo you have this in a larger size?\nCan I get a receipt, please?\nThe weather forecast says it might rain.\nLet's split the bill.\nI'm looking for the nearest pharmacy.\nCould you take a photo of us?\nThe queue is moving pretty fast.\nI lost my way, can you help me?\nWhat time does the museum close?\nI'd prefer something not too spicy.\nDo you accept mobile payment?\nThe view from here is absolutely stunning.\nLet's leave earlier to avoid traffic.\nI forgot to bring a charger.\nIs breakfast included in the price?\nThis place is way more lively at night."}, {"id": "sp_emo", "title": "情绪与观点表达 15 条", "level": "中级", "src": "自建", "kind": "语感积累", "desc": "表达感受、态度、立场，让口语自然有温度。", "text": "I'm a bit overwhelmed lately.\nTo be honest, I'm on the fence about it.\nThat's easier said than done.\nI couldn't agree more.\nI see your point, but I have reservations.\nIt really gets on my nerves when meetings run late.\nI'm thrilled about the news.\nThat took a weight off my shoulders.\nI'm not a big fan of crowded places.\nFrankly, it's not worth the effort.\nI'm torn between two options.\nIt brightens my day when someone says thanks.\nI feel a bit under the weather today.\nLet's look on the bright side.\nThat comment really warmed my heart."}, {"id": "sp_ielts1", "title": "雅思口语 Part 1 常见题 15 条", "level": "中高级", "src": "自建", "kind": "考试向", "desc": "用这些回答模板练流畅度，替换加粗信息即可套用。", "text": "I live in a bustling city with great public transport.\nMy favorite season is autumn because the weather is mild.\nI'm into photography in my spare time.\nI usually unwind by taking a long walk.\nThe best part of my day is the morning coffee.\nI prefer texting to calling, to be honest.\nI keep fit by doing yoga twice a week.\nMy hometown is famous for its street food.\nI'm a morning person, so I get most done before noon.\nReading helps me relax after a busy day.\nI celebrate my birthday with close friends.\nI enjoy documentaries about nature.\nWeekends are for recharging, not for overtime.\nI'm saving up for a trip next summer.\nMusic is a big part of my daily routine."}, {"id": "sp_tech_news", "title": "影子跟读 · 科技新闻（AI 摘要）", "level": "进阶", "src": "自建", "kind": "语流训练", "desc": "不追求听懂，只追求跟上。落后原声 0.5~1 秒开口，重点模仿重音位置。", "text": "Good morning, and thanks for joining us.\nIn today's tech briefing, a major social platform announced a new tool that turns long articles into short video summaries.\nThe company says the feature uses artificial intelligence to keep the original meaning.\nEarly users reported saving nearly half the time they usually spend reading.\nCritics warn that short summaries may leave out important context.\nThe firm promised clearer labels on AI-generated content.\nWe'll continue to follow this story as more details emerge."}, {"id": "sp_d_order_food", "title": "餐厅点餐全场景", "level": "中级", "src": "自建", "kind": "场景积累", "desc": "进店→点单→特殊要求→结账，全套走一遍，吃到国外也不慌。", "text": "Could we have a table for two, please?\nI'd like to see the menu first.\nWhat do you recommend for today's special?\nI'll have the grilled chicken salad, please.\nCould I get that without onions?\nAnd a glass of sparkling water, no ice.\nIs the soup served with bread?\nCould we get a couple of extra napkins?\nThat was delicious, thank you.\nCould we have the bill, please?\nCan I pay by mobile, or is it cash only?\nKeep the change, it's for the server."}, {"id": "sp_d_shopping", "title": "购物与退换实战", "level": "中级", "src": "自建", "kind": "场景积累", "desc": "试穿、砍价、退换货，把这几句练到脱口而出。", "text": "Excuse me, where can I find the fitting room?\nDo you have this in a smaller size?\nThis one feels a bit tight around the shoulders.\nIs there any discount if I buy two?\nI'd like to return this, it doesn't fit.\nDo you have the receipt on file?\nCan I get a store credit instead of cash?\nThe zipper broke after one wear.\nCould you check if it's still in warranty?\nI'll think about it and come back later."}, {"id": "sp_d_phonecall", "title": "电话预约与改期", "level": "入门→中级", "src": "自建", "kind": "场景积累", "desc": "预约、确认、改期，电话里也能说得清楚。", "text": "Hi, I'd like to make an appointment for tomorrow.\nWhat time slots do you have available?\nDoes that include a consultation fee?\nCould you put me down for 3 p.m.?\nI'm calling to confirm my booking.\nI'm afraid I need to reschedule.\nWould 4 p.m. work instead?\nCould you spell your name for me?\nI'll receive a reminder by text, right?\nThank you, that's very helpful."}, {"id": "sp_d_ask_way", "title": "问路与地面交通", "level": "入门→中级", "src": "自建", "kind": "场景积累", "desc": "陌生城市靠这几句就能自己走。", "text": "Excuse me, is the subway station nearby?\nWhich exit should I take for the museum?\nHow long does it take to walk there?\nCould you show me on the map?\nIs there a direct bus to the old town?\nDo I need to transfer along the way?\nThe GPS says to turn left here.\nAm I going the right direction?\nHow much is a single ticket?\nThanks a lot, you saved me."}, {"id": "sp_d_doctor", "title": "看病就医沟通", "level": "中级", "src": "自建", "kind": "场景积累", "desc": "说清症状、听懂医嘱，在国外看病必备。", "text": "I've had a sore throat since yesterday.\nI think I might be running a fever.\nDo I need to see a specialist?\nHow often should I take this medicine?\nAre there any side effects?\nShould I avoid certain foods?\nCan you write a sick note for work?\nWhen should I come back for a check-up?\nThe pain hasn't gone down yet.\nCall me if the results are abnormal."}, {"id": "sp_d_bank", "title": "银行开户与换汇", "level": "中级", "src": "自建", "kind": "场景积累", "desc": "办卡、绑卡、换汇、打流水，都在这里。", "text": "I'd like to open a savings account.\nWhat documents do I need to bring?\nIs there a monthly service fee?\nCan I link it to my mobile wallet?\nWhat's the daily withdrawal limit?\nHow do I reset my online banking password?\nI'd like to exchange some foreign currency.\nWhat's today's exchange rate?\nCould you print a mini statement?\nThank you for your patience."}, {"id": "sp_d_smalltalk", "title": "寒暄破冰 10 句", "level": "入门→中级", "src": "自建", "kind": "场景积累", "desc": "认识新朋友、聊天的开场白。", "text": "So, what brings you here today?\nHave we met at the workshop before?\nI love your backpack, where's it from?\nWhat do you usually do on weekends?\nI'm into hiking when the weather's nice.\nSmall world, I'm from the same city!\nHave you tried the coffee downstairs?\nWhat are you reading these days?\nI didn't catch your name, sorry.\nAnyway, great talking with you."}, {"id": "sp_d_invite", "title": "邀请与赴约", "level": "中级", "src": "自建", "kind": "场景积累", "desc": "约饭、约玩、婉拒、改期，社交刚需。", "text": "We're having a few friends over Saturday.\nWould you like to join us for dinner?\nDo you have any dietary restrictions?\nI can pick you up around seven.\nBring whoever you like, the more the merrier.\nLet me know if you can make it.\nSadly I'm booked that evening.\nRain check? Maybe next week?\nThanks for the invite, I'd love to.\nI'll save you a seat."}, {"id": "sp_d_complaint", "title": "投诉与售后", "level": "中高级", "src": "自建", "kind": "场景积累", "desc": "东西不对、没收到，有理有据地维权。", "text": "I'm calling about an order that never arrived.\nThe item I received is the wrong color.\nI'd like a full refund, please.\nThis is the third time it's happened.\nCan you escalate this to a manager?\nI have photos as proof.\nWhen can I expect a response?\nYour service used to be better.\nI'd appreciate a discount for the trouble.\nLet's settle this fairly."}, {"id": "sp_d_apology", "title": "道歉与原谅", "level": "中级", "src": "自建", "kind": "语感积累", "desc": "真诚道歉、大方原谅，关系更稳。", "text": "I'm really sorry about the mix-up.\nIt was completely my fault.\nPlease accept my apology.\nI should have double-checked.\nWon't happen again, I promise.\nNo hard feelings, okay?\nThanks for being understanding.\nI owe you one.\nLet's move past it.\nApology accepted, don't worry."}, {"id": "sp_c_library", "title": "图书馆借还书", "level": "中级", "src": "自建", "kind": "校园", "desc": "借书、续借、找书、打印，校园日常。", "text": "Hi, I'd like to borrow this book.\nHow many books can I check out at once?\nWhen is it due back?\nCan I renew it online?\nIs there a quiet study room available?\nThe printer in the corner is jammed.\nDo you have the latest edition of this textbook?\nI left my notebook at a desk, have you seen it?\nCould you show me how to use the catalogue?\nThe Wi-Fi here is pretty fast, right?"}, {"id": "sp_c_group", "title": "小组作业协作", "level": "中级", "src": "自建", "kind": "校园", "desc": "分工、同步、赶进度，小组作业全靠它。", "text": "Let's divide the work by next Tuesday.\nI'll take care of the data analysis.\nCould you draft the introduction first?\nWe should sync twice a week.\nThe slides need to be simpler.\nWho's presenting on Friday?\nLet's meet at the library at three.\nI'll share the doc so we can edit together.\nWe're behind schedule, pick up the pace.\nGreat job, that's a solid first draft."}, {"id": "sp_c_exam", "title": "备考互相抽背", "level": "中级", "src": "自建", "kind": "校园", "desc": "和同学对练，把知识说出口才记得住。", "text": "How are you preparing for the finals?\nI made flashcards for the key terms.\nWant to do a mock test together?\nThe past papers really help.\nI keep mixing up these two concepts.\nLet's quiz each other tonight.\nDon't cram, sleep is more useful now.\nI'll explain it with an example.\nThe essay counts for half the grade.\nWe've got this, just stay calm."}, {"id": "sp_c_club", "title": "社团招新与加入", "level": "中级", "src": "自建", "kind": "校园", "desc": "认识同好、加入组织，丰富简历。", "text": "What kind of activities does your club run?\nI'm interested in joining the photography club.\nIs there a membership fee?\nHow often do you meet?\nDo I need any prior experience?\nWe're recruiting new editors this term.\nYou can just show up at the next session.\nIt's a great way to meet people.\nSign up here with your student ID.\nWelcome aboard, see you Thursday!"}, {"id": "sp_c_prof", "title": "找导师 / Office Hour", "level": "中高级", "src": "自建", "kind": "校园", "desc": "主动找老师、问方向、要反馈。", "text": "Professor, could I talk about my thesis?\nDo you have office hours this week?\nI'm stuck on the literature review.\nCould you point me to some readings?\nI'd like your feedback on my draft.\nIs this research angle worth pursuing?\nWhen is the proposal due?\nMay I sit in on your seminar?\nThanks for the clear guidance.\nI'll revise and send it over."}, {"id": "sp_c_graduate", "title": "毕业论文进度沟通", "level": "高级", "src": "自建", "kind": "校园", "desc": "开题、写作、答辩前的常用表达。", "text": "I finally finished my first chapter.\nThe methodology section is tricky.\nMy sample size feels too small.\nThe data supports my hypothesis.\nI need two more weeks to edit.\nThe citation format is driving me crazy.\nMy advisor suggested a case study.\nThe defense is scheduled for June.\nI'm both excited and terrified.\nOne more round of proofreading, then done."}, {"id": "sp_w_meeting", "title": "开会发言与控场", "level": "中高级", "src": "自建", "kind": "求职专用", "desc": "开会高频句，外企/大厂实习直接能用。", "text": "Let's get started, everyone's here.\nQuick recap of last week's actions.\nI'll own the research part.\nCan we park that topic for later?\nTo summarize, here's the plan.\nAny objections before we lock it in?\nI'll circulate the notes after.\nLet's keep it to fifteen minutes.\nGood progress, keep it up.\nNext sync is Thursday, same time."}, {"id": "sp_w_email", "title": "职场邮件高频句", "level": "中高级", "src": "自建", "kind": "求职专用", "desc": "写邮件不卡壳，专业又利落。", "text": "I'm writing to follow up on our chat.\nPlease find the report attached.\nCould you review by end of day?\nLooping in the finance team.\nApologies for the delayed reply.\nLet's take this offline.\nI've flagged the urgent items.\nConfirm receipt when you can.\nGreat, that works on my end.\nTalk soon, and thanks again."}, {"id": "sp_w_feedback", "title": "述职与 1on1", "level": "高级", "src": "自建", "kind": "求职专用", "desc": "讲产出、谈成长，向上管理就这么聊。", "text": "Here's what I delivered this quarter.\nMy focus was improving retention.\nThe biggest win was the launch.\nOne area I want to grow is strategy.\nCould I get more ownership next time?\nI'd value candid feedback.\nThe timeline was tighter than expected.\nI learned to scope better.\nLet's set one clear goal for Q3.\nThanks for the support."}, {"id": "sp_w_negotiate", "title": "薪资与 offer 谈判", "level": "高级", "src": "自建", "kind": "求职专用", "desc": "秋招终面常考，练到不心虚。", "text": "I'm excited about the offer.\nBased on the market, I was hoping for a bit more.\nCould we discuss the base salary?\nIs there flexibility on the signing bonus?\nI have another offer at a higher range.\nI'm confident I can deliver value fast.\nWhat does the review cycle look like?\nCould the title be adjusted?\nI appreciate your consideration.\nLet's proceed, I'm on board."}, {"id": "sp_w_presentation", "title": "工作汇报 / 路演", "level": "高级", "src": "自建", "kind": "求职专用", "desc": "讲结果、给建议，汇报结构一套带走。", "text": "Today I'll walk you through the results.\nThe key insight is user retention.\nEngagement rose by twenty percent.\nWe tested two versions, B won.\nThe cost per click dropped sharply.\nNext, we scale the winning variant.\nRisks include seasonality.\nI recommend a phased rollout.\nHappy to take questions.\nThanks for your time."}, {"id": "sp_w_customer", "title": "客服应对话术", "level": "中高级", "src": "自建", "kind": "求职专用", "desc": "运营/客服岗面试与实习都常用。", "text": "Thanks for reaching out, how can I help?\nI'm sorry to hear that, let's fix it.\nCould you share your order number?\nI'll look into this right away.\nWe'll send a replacement today.\nAs a gesture, here's a coupon.\nYour satisfaction matters to us.\nI've escalated this to the team.\nYou'll hear back within twenty-four hours.\nIs there anything else I can do?"}, {"id": "sp_w_onboard", "title": "新人入职融入", "level": "中级", "src": "自建", "kind": "求职专用", "desc": "刚入职怎么接话、怎么问，不露怯。", "text": "Welcome to the team, glad you're here.\nYour laptop and accounts are ready.\nI'll be your buddy for the first month.\nHere's the onboarding doc.\nDon't hesitate to ask anything.\nOur standup is at nine thirty.\nShadow me on a couple of calls.\nThe wiki has most answers.\nWe ship every two weeks.\nExcited to see what you'll build."}, {"id": "sp_w_resign", "title": "离职与交接", "level": "中高级", "src": "自建", "kind": "求职专用", "desc": "体面离开，也是职业素养的一部分。", "text": "I've decided to move on.\nI'll document everything I own.\nLet's schedule a handover.\nI'll train my replacement next week.\nThe password vault is shared.\nOpen tasks are in the tracker.\nThanks for the opportunities.\nI learned a ton here.\nKeep in touch, LinkedIn?\nWishing the team all the best."}, {"id": "sp_t_hotel", "title": "酒店入住与客房", "level": "中级", "src": "自建", "kind": "旅行", "desc": "订房、入住、提需求、退房。", "text": "I have a reservation under Lee.\nCould I get a room with a city view?\nWhat time is checkout?\nIs breakfast included?\nThe air conditioning isn't working.\nCould we get extra pillows?\nWhere's the nearest elevator?\nCan I store my luggage after checkout?\nIs there a gym on site?\nThanks, the room is lovely."}, {"id": "sp_t_airport", "title": "机场值机与登机", "level": "中级", "src": "自建", "kind": "旅行", "desc": "值机、托运、转机、登机口。", "text": "I'd like to check in for flight CA123.\nWindow or aisle, which do you prefer?\nCan I take this as carry-on?\nHow much is the overweight fee?\nWhere's the boarding gate?\nMy flight is delayed, right?\nHow long is the layover?\nDo I need a transit visa?\nCould you print my boarding pass?\nGate closes in twenty minutes, hurry."}, {"id": "sp_t_lost", "title": "物品遗失求助", "level": "中高级", "src": "自建", "kind": "旅行", "desc": "丢东西不慌，照着说就能找回。", "text": "I think I left my bag on the train.\nCould you check the lost and found?\nIt's a black backpack with a tag.\nWhen did you last see it?\nI filed a report online already.\nHas anyone turned it in?\nCould you describe it for me?\nWe'll call if we find anything.\nThank you, I really appreciate it.\nHere's my contact number."}, {"id": "sp_t_food", "title": "异国餐厅点餐", "level": "中级", "src": "自建", "kind": "旅行", "desc": "过敏、辣度、买单，吃得安心。", "text": "What's the local specialty?\nIs this dish very spicy?\nCould you make it mild, please?\nI'm allergic to nuts.\nA glass of the house red, please.\nCould we get the bill separately?\nThat was the best meal so far.\nDo you accept contactless payment?\nWhere's a good spot for dessert?\nThanks for the recommendation."}, {"id": "sp_t_transport", "title": "当地交通出行", "level": "中级", "src": "自建", "kind": "旅行", "desc": "买票、问路、打车、步行。", "text": "Where can I buy a transit pass?\nDoes this bus go to the beach?\nHow many stops to the center?\nCan I tap my phone to ride?\nIs the night service running?\nCould the driver let me know when to get off?\nIs it safe to walk back?\nRent a bike by the hour?\nThe app says a car will arrive in three minutes.\nThanks, that was a smooth ride."}, {"id": "sp_t_shopping", "title": "免税店与伴手礼", "level": "中级", "src": "自建", "kind": "旅行", "desc": "免税、送礼、退换，买得明白。", "text": "Are these prices tax-free?\nCan I see the duty-free allowance?\nDo you have this in a gift box?\nIs there a limit per person?\nCould I try the fragrance on?\nThe blue one is for my sister.\nCan you wrap it together?\nWhat's the return policy abroad?\nI'll take two of these.\nPlease keep the receipt."}, {"id": "sp_e_agree", "title": "赞同与反驳", "level": "中高级", "src": "自建", "kind": "语感积累", "desc": "讨论里有礼有节地表达立场。", "text": "I couldn't agree more.\nThat's a fair point.\nI see where you're coming from.\nOn the other hand, consider the cost.\nI'm not entirely convinced.\nLet's agree to disagree.\nYou've changed my mind, actually.\nThat's not quite how I see it.\nFair enough, but the risk is real.\nI'm with you on the goal."}, {"id": "sp_e_persuade", "title": "说服他人", "level": "高级", "src": "自建", "kind": "语感积累", "desc": "用逻辑和共情把人说服。", "text": "Hear me out for a second.\nThe data actually supports this.\nIt's a small change with big upside.\nWhat if we tried it for a week?\nThe cost is lower than you think.\nOthers have seen great results.\nWorst case, we revert it.\nI'll take the first step.\nTrust me, it's worth a shot.\nShall we give it a go?"}, {"id": "sp_e_comfort", "title": "安慰朋友", "level": "中高级", "src": "自建", "kind": "语感积累", "desc": "把关心说到位，关系更近。", "text": "I'm really sorry you're going through this.\nThat sounds incredibly tough.\nTake all the time you need.\nI'm here for you, no matter what.\nIt's okay to not be okay.\nYou've handled worse before.\nWant to talk it through?\nLet's grab a coffee later.\nThings will get better, I promise.\nYou're stronger than you think."}, {"id": "sp_e_excite", "title": "表达激动与开心", "level": "中级", "src": "自建", "kind": "语感积累", "desc": "分享好消息时更有感染力。", "text": "I'm so pumped about this!\nThis is literally a dream come true.\nI can't believe it actually happened.\nBest news I've had all year.\nI'm over the moon right now.\nWe did it, all of us!\nThis calls for a celebration.\nI'm grinning like an idiot.\nThank you for making this possible.\nI'm still shaking, honestly."}, {"id": "sp_e_disappoint", "title": "表达失望", "level": "中高级", "src": "自建", "kind": "语感积累", "desc": "得体地表达失落，不抱怨。", "text": "I was really looking forward to it.\nHonestly, I'm a bit let down.\nIt didn't turn out as hoped.\nI won't lie, I'm disappointed.\nWe were so close, too.\nMaybe next time, I guess.\nIt's a shame it fell through.\nI expected a bit more, to be frank.\nLet's learn from it and move on.\nTomorrow's a fresh start."}, {"id": "sp_e_uncertain", "title": "表达不确定", "level": "中高级", "src": "自建", "kind": "语感积累", "desc": "不瞎承诺，留有余地。", "text": "I'm not a hundred percent sure.\nIt's hard to say at this point.\nMy gut says probably not.\nDon't quote me on this.\nThe picture isn't clear yet.\nI'll confirm and get back to you.\nIt could go either way.\nWe'll know more next week.\nI'd rather not speculate.\nLet's wait for the official word."}, {"id": "sp_x_ielts2", "title": "雅思 Part 2 个人长回答", "level": "中高级", "src": "自建", "kind": "考试向", "desc": "2 分钟独白框架，替换信息即可套用。", "text": "I'd like to talk about a person who inspired me.\nShe was my high school English teacher.\nWhat I admire most is her patience.\nI remember one lesson that changed me.\nShe always encouraged us to speak up.\nThat experience shaped who I am.\nIf I met her today, I'd say thank you.\nI think good teachers are unforgettable.\nThis memory still makes me smile.\nTo sum up, she truly made a difference."}, {"id": "sp_x_ielts3", "title": "雅思 Part 3 深度讨论", "level": "高级", "src": "自建", "kind": "考试向", "desc": "抽象问题怎么展开，练逻辑。", "text": "Why do people enjoy learning from others?\nI think role models make goals feel real.\nHow has education changed recently?\nTechnology has made it far more accessible.\nShould schools teach life skills?\nAbsolutely, exams aren't the whole of life.\nWhat makes a good learner?\nCuriosity and consistency, I'd say.\nDo you think grades matter?\nThey matter less than real understanding."}, {"id": "sp_x_toefl", "title": "托福独立口语框架", "level": "高级", "src": "自建", "kind": "考试向", "desc": "给观点+理由+例子，标准结构。", "text": "Some people prefer to work in teams.\nI tend to agree with that view.\nWorking alone gives you full control.\nBut teams bring diverse ideas.\nIn my experience, a mix works best.\nFor creative tasks, I like solitude.\nFor big projects, collaboration wins.\nIt also depends on the deadline.\nEither way, communication is key.\nThat's why I adapt to the situation."}, {"id": "sp_x_story", "title": "个人经历讲述（作品集向）", "level": "中高级", "src": "自建", "kind": "考试向", "desc": "讲清「我做过什么、学到什么」，面试也用得上。", "text": "Let me tell you about a small win.\nLast month I posted my first video.\nI was nervous it would flop.\nTurns out people loved the honesty.\nIt reached ten thousand views overnight.\nI replied to every single comment.\nThat taught me to ship before perfect.\nNow I post weekly without fear.\nThe numbers matter less than the habit.\nConsistency really is a superpower."}, {"id": "sp_s_ted", "title": "影子跟读 · TED 开场", "level": "进阶", "src": "自建", "kind": "语流训练", "desc": "不追求听懂，只追着重音和停顿。", "text": "Good morning, everyone, and thank you for being here.\nThe idea I want to share started with a question.\nWhat if the way we learn is backwards?\nFor years we believed practice makes perfect.\nBut research tells a more interesting story.\nLet me show you what I mean.\nHere is a simple example from everyday life.\nNotice how small changes add up.\nI'll walk you through three steps.\nAnd by the end, you'll try one yourself."}, {"id": "sp_s_podcast", "title": "影子跟读 · 播客片段", "level": "进阶", "src": "自建", "kind": "语流训练", "desc": "连读弱读密集，练耳朵首选。", "text": "Welcome back to the show, this is your host.\nToday we're talking about building habits.\nMost people start strong and then fade.\nThe trick is to make it almost too easy.\nTwo minutes is better than nothing.\nStack the new habit onto an old one.\nThat's called habit stacking, by the way.\nIt sounds simple, and that's the point.\nWe'll take a quick break, be right back.\nThanks for listening, more after this."}, {"id": "sp_s_story", "title": "短文朗读 · 睡前故事风", "level": "中级", "src": "自建", "kind": "语流训练", "desc": "节奏舒缓，适合放松时跟读。", "text": "Once upon a time, there was a small blue boat.\nIt sailed across a quiet silver lake.\nThe wind was gentle, the stars were bright.\nA friendly moon watched from the sky.\nThe boat hummed a little song of home.\nIt met a duck who paddled by to say hello.\nThey shared a story till the night grew late.\nThen the boat drifted softly back to shore.\nIt closed its eyes and dreamed of the sea.\nAnd the lake whispered, sleep well, little boat."}, {"id": "sp_s_speech", "title": "影子跟读 · 毕业演讲", "level": "进阶", "src": "自建", "kind": "语流训练", "desc": "正式语体，练气势和停顿。", "text": "Class of this year, look at how far you've come.\nFour years ago, you walked in with a question.\nToday, you leave with a voice of your own.\nYou will fail, and that is not the end.\nFailure is simply data for the next try.\nBe kind, be curious, be impossibly yourself.\nThe world needs what only you can offer.\nSo go, and build something that matters.\nWe are proud of you, every single one.\nNow close your laptop, and open your life."}, {"id": "sp_s_news2", "title": "影子跟读 · 财经新闻", "level": "进阶", "src": "自建", "kind": "语流训练", "desc": "数字和术语密集，练信息抓取。", "text": "Markets opened higher this morning on strong earnings.\nTech shares led the gains across the board.\nThe central bank held interest rates steady.\nAnalysts expect growth to slow next quarter.\nInflation eased for a second month in a row.\nConsumer spending remained surprisingly resilient.\nThe currency firmed against the dollar.\nInvestors are watching the jobs report closely.\nWe'll have full coverage on the nightly news.\nThat's your market update for today."}, {"id": "sp_s_interview", "title": "影子跟读 · 名人访谈", "level": "进阶", "src": "自建", "kind": "语流训练", "desc": "自然口语节奏，学怎么把话说自然。", "text": "So tell me, what got you started in this field?\nHonestly, I just followed a thing I loved.\nThere were a lot of nights I wanted to quit.\nBut I kept showing up, and things shifted.\nThe biggest lesson was to stay close to users.\nWe almost ran out of money in year two.\nWhat saved us was listening, not guessing.\nNow I tell young founders, ship and learn.\nFear is just excitement without the brea 觉素材参考\n学什么：低饱和、大留白、自然光、生活化道具", "url": "https://www.xiaohongshu.com/search_result?keyword=%E9%9F%A9%E7%B3%BB%20%E6%B0%9B%E5%9B%B4%E6%84%9F%20%E6%91%84%E5%BD%B1%20%E6%9E%84%E5%9B%BE"}, {"id": "as_35", "cat": "素材来源", "title": "韩系图片风格参考", "content": "小红书搜「韩系摄影/韩系构图」，看排版和调色", "url": "https://www.xiaohongshu.com/search_result?keyword=%E9%9F%A9%E7%B3%BB%E6%91%84%E5%BD%B1"}, {"id": "as_36", "cat": "素材来源", "title": "Pinterest 灵感板", "content": "搜 korean aesthetic / minimal layout，建自己的灵感板", "url": "https://www.pinterest.com/search/pins/?q=korean%20aesthetic"}, {"id": "as_37", "cat": "素材来源", "title": "Unsplash 免费图库", "content": "商用免费，可做背景素材（注意仍需看具体授权）", "url": "https://unsplash.com"}, {"id": "as_38", "cat": "素材来源", "title": "Pexels 免费图库", "content": "同上，中文搜索也支持", "url": "https://www.pexels.com"}, {"id": "as_39", "cat": "素材来源", "title": "稿定设计 / Canva", "content": "做封面模板，建议自己存一套固定模板", "url": "https://www.canva.cn"}, {"id": "as_40", "cat": "素材来源", "title": "小红书官方创作中心", "content": "看官方数据后台、创作规范、流量扶持活动", "url": "https://creator.xiaohongshu.com"}, {"id": "as_41", "cat": "能力 → 简历话术", "title": "内容策划 / 选题能力", "content": "怎么做：建立选题库并按内容支柱分类，跑通「选题 → 发布 → 数据 → 迭代」闭环\n简历写法：搭建 4 大内容支柱的选题库（累计 {N} 个选题），通过 A/B 测试筛选高潜选题，爆款率从 {x}% 提升至 {y}%", "url": ""}, {"id": "as_42", "cat": "能力 → 简历话术", "title": "数据分析能力", "content": "怎么做：记录每篇笔记的曝光/点击率/赞藏/涨粉，做周维度归因\n简历写法：建立笔记数据看板（{N} 篇样本），通过点击率与赞藏比归因，定位 3 类高转化选题，单篇最高曝光 {x} 次", "url": ""}, {"id": "as_43", "cat": "能力 → 简历话术", "title": "用户洞察 / 痛点挖掘", "content": "怎么做：扒评论区高频问题，整理成用户痛点清单，反哺选题\n简历写法：沉淀 {N} 条用户高频问题，提炼 {M} 个核心痛点，据此调整内容方向，互动率提升 {x}%", "url": ""}, {"id": "as_44", "cat": "能力 → 简历话术", "title": "用户增长", "content": "怎么做：设计连载/打卡系列增强关注动机，评论区运营提高复访\n简历写法：通过连载式内容 + 评论区精细化互动，{N} 天内粉丝从 0 增长至 {x}，平均涨粉成本为 0（纯自然流量）", "url": ""}, {"id": "as_45", "cat": "能力 → 简历话术", "title": "文案能力", "content": "怎么做：标题公式化训练，正文结构模板化\n简历写法：总结 18 类标题公式并建立复用模板库，笔记平均点击率达 {x}%（行业均值 {y}%）", "url": ""}, {"id": "as_46", "cat": "能力 → 简历话术", "title": "视觉/审美能力", "content": "怎么做：统一封面模板、色卡、字体，保持主页调性\n简历写法：建立统一视觉规范（3:4 模板 + 固定色卡），主页调性一致性显著提升，首图点击率提高 {x}%", "url": ""}, {"id": "as_47", "cat": "能力 → 简历话术", "title": "项目管理 / 执行力", "content": "怎么做：按周排期、按月复盘，保持稳定更新\n简历写法：独立完成账号从 0 到 1 的全流程运营，连续 {N} 周稳定更新，执行率 {x}%", "url": ""}, {"id": "as_48", "cat": "能力 → 简历话术", "title": "复盘迭代能力", "content": "怎么做：每周写复盘文档，记录假设-验证-结论\n简历写法：产出 {N} 篇周复盘文档，形成「假设-验证-结论」的迭代方法论，并沉淀为可复用 SOP", "url": ""}, {"id": "as_49", "cat": "数据基准", "title": "首图点击率", "content": "低：< 6% ｜ 中：8% - 12% ｜ 高：> 15%\n低于 6% 说明封面或标题有问题，优先改封面", "url": ""}, {"id": "as_50", "cat": "数据基准", "title": "赞藏比（收藏/点赞）", "content": "低：< 0.3 ｜ 中：0.5 - 0.8 ｜ 高：> 1.0\n> 1 说明是强工具属性干货，长尾流量会很好", "url": ""}, {"id": "as_51", "cat": "数据基准", "title": "互动率（赞藏评/曝光）", "content": "低：< 2% ｜ 中：3% - 6% ｜ 高：> 8%\n互动率决定能否进入下一个流量池", "url": ""}, {"id": "as_52", "cat": "数据基准", "title": "涨粉率（涨粉/曝光）", "content": "低：< 0.1% ｜ 中：0.2% - 0.5% ｜ 高：> 1%\n涨粉低说明内容有用但人设不清晰", "url": ""}, {"id": "as_53", "cat": "数据基准", "title": "完读率", "content": "低：< 30% ｜ 中：40% - 60% ｜ 高：> 70%\n开头 3 行决定完读率", "url": ""}, {"id": "as_54", "cat": "数据基准", "title": "起号期发布频率", "content": "低：< 2 篇/周 ｜ 中：3-4 篇/周 ｜ 高：每日更新\n起号前 30 天频率 > 质量，先跑通流量池", "url": ""}, {"id": "as_55", "cat": "发布前检查清单", "title": "标题", "content": "□ 是否用了明确的标题公式？\n□ 有没有埋搜索关键词？\n□ 字数是否 ≤ 20 字？\n□ 有没有数字或具体结果？", "url": ""}, {"id": "as_56", "cat": "发布前检查清单", "title": "开头 3 行", "content": "□ 第一句能不能单独成立并吸引人？\n□ 有没有直接给结论或抛问题？\n□ 有没有废话式开场（\"大家好我是…\"）？", "url": ""}, {"id": "as_57", "cat": "发布前检查清单", "title": "正文结构", "content": "□ 有没有小标题或序号？\n□ 每段是否 ≤ 3 行？\n□ 有没有可直接执行的动作？\n□ 有没有emoji分隔（适度）？", "url": ""}, {"id": "as_58", "cat": "发布前检查清单", "title": "可信度", "content": "□ 有没有真实数据或时间跨度？\n□ 有没有对比图/过程图？\n□ 有没有承认局限性（更真实）？\n□ 有没有夸大或绝对化表述？", "url": ""}, {"id": "as_59", "cat": "发布前检查清单", "title": "合规", "content": "□ 有没有医疗功效词（祛斑/治疗/根治）？\n□ 有没有绝对化用语（最/第一/100%）？\n□ 广告是否已标注？\n□ 有没有涉及他人肖像未授权？", "url": ""}, {"id": "as_60", "cat": "发布前检查清单", "title": "互动", "content": "□ 结尾有没有提问？\n□ 有没有引导收藏的理由？\n□ 标签是否 ≤ 10 个且精准？", "url": ""}, {"id": "as_61", "cat": "爆款拆解
