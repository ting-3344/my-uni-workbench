<script>
/* =====================================================================
   我的大学工作台 · 单文件离线版
   数据全部保存在本机浏览器 localStorage，不联网、不上传
   ===================================================================== */
"use strict";

/* ---------- 种子数据（旧工作台迁移内容） ---------- */
var SEED = {};
try { SEED = JSON.parse(document.getElementById('seedData').textContent); } catch (e) { SEED = {}; }

var App = {
  KEY: 'my_uni_workbench_v1',
  state: null,
  TYPES: {},
  ui: {},          // 临时视图状态（不落盘）
  cur: null,       // 当前板块
  mode: 'view',    // view | admin
  drawer: null     // 当前抽屉板块 id
};

/* ===================== 界面偏好（侧栏折叠等） ===================== */
var UIKEY = 'my_uni_workbench_ui_v1';
function loadUI() {
  try { return JSON.parse(localStorage.getItem(UIKEY) || '{}') || {}; } catch (e) { return {}; }
}
function saveUI(u) { try { localStorage.setItem(UIKEY, JSON.stringify(u || {})); } catch (e) { } }
function isMobile() { return window.matchMedia && window.matchMedia('(max-width:880px)').matches; }
function setSbMin(v) {
  var u = loadUI(); u.sbMin = !!v; saveUI(u);
  document.body.classList.toggle('sb-min', !!v && !isMobile());
}
function toggleSb() {
  if (isMobile()) { document.body.classList.toggle('sb-open'); return; }
  setSbMin(!document.body.classList.contains('sb-min'));
}
function closeSb() { document.body.classList.remove('sb-open'); }

/* ===================== 侧边抽屉 Drawer ===================== */
function drawerBody(s) {
  var d = today();
  var h = '<div class="dv-head"><span class="dv-ico">' + esc(s.icon || '📌') + '</span>' +
    '<div class="sp"><h3>' + esc(s.name) + '</h3>' +
    '<div class="muted">' + esc(s.sub || tdef(s.type).desc || '') + '</div></div></div>';

  if (s.type === 'todo') {
    var items = todoItemsSorted(s).filter(function (i) { return !i.done; });
    var late = items.filter(function (i) { return i.date && i.date < d; });
    var near = items.filter(function (i) { return !i.date || i.date >= d; }).slice(0, 8);
    if (late.length) h += '<div class="warnbox mb">有 ' + late.length + ' 件已逾期未完成，记得顺延或处理掉。</div>';
    if (!near.length) h += emptyBox('近期没有待办，进板块加一条吧');
    near.forEach(function (i) {
      h += '<div class="li"><div class="cbx" data-act="dv-todo" data-id="' + s.id + '|' + i.id + '">✓</div>' +
        '<div class="li-b"><div class="li-t">' + esc(i.title) + '</div>' +
        '<div class="li-m">' +
        (i.date ? '<span class="tag">' + md(i.date) + ' · ' + relLabel(i.date) + '</span>' : '') +
        (i.type ? '<span class="tag gold">' + esc(i.type) + '</span>' : '') +
        '</div></div></div>';
    });
    if (items.length > 8) h += '<div class="muted mt-s">…… 还有 ' + (items.length - 8) + ' 件未完成</div>';
    return h;
  }

  if (s.type === 'habit') {
    var arr = s.data.items || [], n = 0;
    if (!arr.length) { h += emptyBox('还没有习惯项目'); return h; }
    arr.forEach(function (it) {
      if (habitDone(s, it.id, d)) n++;
      h += '<div class="li"><div class="cbx' + (habitDone(s, it.id, d) ? ' on' : '') + '" data-act="dv-habit" data-id="' + s.id + '|' + it.id + '">✓</div>' +
        '<div class="li-b"><div class="li-t">' + esc(it.name) + '</div>' +
        (it.note ? '<div class="li-m">' + esc(it.note) + '</div>' : '') + '</div>' +
        '<span class="tag' + (habitStreak(s, it.id) >= 3 ? ' gold' : '') + '">连续 ' + habitStreak(s, it.id) + ' 天</span></div>';
    });
    h += '<div class="pg mt"><i style="width:' + pct(n, arr.length) + '%"></i></div>' +
      '<div class="muted mt-s">今日已打卡 ' + n + '/' + arr.length + ' 项</div>';
    return h;
  }

  if (s.type === 'table') {
    var cols = s.data.cols || [], rows = s.data.rows || [];
    var statusCol = cols.filter(function (c) { return c.key === 'status'; })[0] || cols.filter(function (c) { return c.type === 'select'; })[0];
    var fk = statusCol ? statusCol.key : 'status';
    var counts = {};
    rows.forEach(function (r) { var v = String(r[fk] || '—'); counts[v] = (counts[v] || 0) + 1; });
    var sent = rows.filter(function (r) { return String(r[fk] || '') !== '' && String(r[fk]) !== '未投出'; }).length;
    h += '<div class="row"><div class="sp"><div class="num">' + sent + ' / ' + rows.length + '</div>' +
      '<div class="muted">已推进 / 总登记数</div></div></div>' +
      '<div class="pg mt-s"><i style="width:' + pct(sent, rows.length) + '%"></i></div>';
    h += '<div class="chiprow mt">' + Object.keys(counts).map(function (k) {
      return '<span class="chip static">' + esc(k) + ' · ' + counts[k] + '</span>';
    }).join('') + '</div>';
    if (!rows.length) { h += emptyBox('还没有记录'); return h; }
    h += '<div class="mt"><div class="muted mb-s">最近更新</div>';
    rows.slice(-5).reverse().forEach(function (r) {
      h += '<div class="kv"><span class="k">' + esc(md(r.applyDate || r.interviewDate || '')) + '</span>' +
        '<span class="v">' + esc(r.company || '—') + ' · ' + esc(r.job || '') + ' ' + statusTag(r[fk]) + '</span></div>';
    });
    h += '</div>';
    return h;
  }

  if (s.type === 'goal') {
    var gs = (s.data.items || []).slice().sort(function (a, b) { return String(a.deadline || '').localeCompare(String(b.deadline || '')); });
    if (!gs.length) { h += emptyBox('还没有目标'); return h; }
    gs.forEach(function (g) {
      var left = g.deadline ? dayDiff(d, g.deadline) : null;
      var pv = clamp(pct(num(g.current, 0), num(g.target, 100)), 0, 100);
      h += '<div class="li"><div class="sp"><div class="li-t">' + esc(g.title) + '</div>' +
        '<div class="li-m"><span class="tag' + (left != null && left >= 0 ? '' : ' dang') + '">' +
        (left == null ? '未设日期' : (left >= 0 ? '还剩 ' + left + ' 天' : '已过期 ' + (-left) + ' 天')) + '</span>' +
        '<span>' + pv + '%</span></div>' +
        '<div class="pg mt-s"><i style="width:' + pv + '%"></i></div></div></div>';
    });
    return h;
  }

  if (s.type === 'links') {
    var lks = s.data.links || [];
    if (!lks.length) { h += emptyBox('还没有链接'); return h; }
    lks.forEach(function (l) {
      var u = String(l.url || '').trim();
      h += '<div class="lnk"><div class="li-ico">' + (LINK_ICONS[l.kind] || '🔗') + '</div>' +
        '<div class="li-b"><div style="font-size:14px">' +
        (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(l.title || '未命名') + ' ↗</a>' : esc(l.title || '未命名')) +
        '</div><div class="u">' + esc(u) + '</div>' +
        (l.note ? '<div class="muted" style="font-size:11.5px">' + esc(l.note) + '</div>' : '') + '</div></div>';
    });
    return h;
  }

  if (s.type === 'media') {
    var md = s.data || {}, names2 = { bench: '① 对标库', viral: '② 爆款拆解', ideas: '③ 灵感池', titles: '④ 标题', drafts: '⑤ 正文', shots: '⑥ 配图', logs: '⑦ 数据台账', assets: '⑧ 素材库' };
    if (md.memo) h += '<div class="tip mb">' + nl2br(String(md.memo).slice(0, 160)) + (String(md.memo).length > 160 ? '…' : '') + '</div>';
    Object.keys(names2).forEach(function (k) {
      h += '<div class="kv"><span class="k">' + names2[k] + '</span><span class="v">' + ((md[k] || []).length) + ' 条</span></div>';
    });
    return h;
  }

  if (s.type === 'doc') {
    h += '<div class="tip mb">' + esc(s.data.note || '这是飞书多维表格的实时页面，打开板块即可查看最新内容。') + '</div>' +
      '<div class="kv"><span class="k">文档标题</span><span class="v">' + esc(s.data.title || s.name) + '</span></div>' +
      '<div class="kv"><span class="k">同步方式</span><span class="v">iframe 实时嵌入</span></div>';
    return h;
  }

  /* 其余资料库类：给个概览 + 入口 */
  var cnt = (s.data.items || s.data.rows || s.data.groups || []).length || 0;
  h += '<div class="tip mb">' + esc(tdef(s.type).desc || '') + '</div>' +
    '<div class="kv"><span class="k">数据条目</span><span class="v">' + cnt + ' 条</span></div>' +
    '<div class="muted mt">点下方按钮进入完整板块查看全部内容。</div>';
  return h;
}

function openDrawer(sid) {
  var s = secById(sid);
  if (!s) return;
  var root = document.getElementById('drawerRoot');
  App.drawer = sid;
  root.innerHTML =
    '<div class="drawer-mask" data-dmask></div>' +
    '<aside class="drawer">' +
    '<div class="drawer-h"><span class="dv-ico" style="width:34px;height:34px;flex:0 0 34px;font-size:17px">' + esc(s.icon || '📌') + '</span>' +
    '<h3 class="sp">' + esc(s.name) + '</h3>' +
    '<button class="icon-btn" data-act="dv-close" title="关闭">✕</button></div>' +
    '<div class="drawer-b" id="drawerBody">' + drawerBody(s) + '</div>' +
    '<div class="drawer-f"><button class="btn gold sp" data-act="dv-goto" data-id="' + s.id + '">打开完整板块 →</button></div>' +
    '</aside>';
  root.querySelector('[data-dmask]').addEventListener('click', closeDrawer);
  /* 下一帧再加 open，保证有滑入动画；用 setTimeout 兜底防止 rAF 不触发 */
  var fire = function () {
    var dk = root.querySelector('.drawer'), mk = root.querySelector('.drawer-mask');
    if (dk) dk.classList.add('open');
    if (mk) mk.classList.add('show');
  };
  if (window.requestAnimationFrame) window.requestAnimationFrame(fire);
  setTimeout(fire, 30);
}
function closeDrawer() {
  var root = document.getElementById('drawerRoot');
  if (!root || !root.firstChild) return;
  var dk = root.querySelector('.drawer'), mk = root.querySelector('.drawer-mask');
  if (mk) mk.classList.remove('show');
  if (dk) dk.classList.remove('open');
  App.drawer = null;
  setTimeout(function () { if (!App.drawer) root.innerHTML = ''; }, 340);
}
function refreshDrawer() {
  if (!App.drawer) return;
  var s = secById(App.drawer);
  var box = document.getElementById('drawerBody');
  if (!s || !box) { closeDrawer(); return; }
  box.innerHTML = drawerBody(s);
}

/* ===================== 首页卡片统计 ===================== */
function briefStat(x) {
  var d = today();
  if (x.type === 'todo') {
    var all = x.data.items || [];
    var un = all.filter(function (i) { return !i.done; }).length;
    var ta = all.filter(function (i) { return i.date === d; });
    var dn = ta.filter(function (i) { return i.done; }).length;
    return { txt: '未完成 ' + un + ' 项 · 今日 ' + dn + '/' + ta.length, pct: todoStats(x).pct };
  }
  if (x.type === 'habit') {
    var arr = x.data.items || [], n = 0;
    arr.forEach(function (h) { if (habitDone(x, h.id, d)) n++; });
    return { txt: arr.length + ' 个习惯 · 今日 ' + n + '/' + arr.length, pct: pct(n, arr.length) };
  }
  if (x.type === 'table') {
    var rows = x.data.rows || [];
    var fk = ((x.data.cols || []).filter(function (c) { return c.key === 'status'; })[0] || {}).key || 'status';
    var sent = rows.filter(function (r) { return String(r[fk] || '') !== '' && String(r[fk]) !== '未投出'; }).length;
    return { txt: rows.length + ' 条记录 · 已推进 ' + sent, pct: pct(sent, rows.length) };
  }
  if (x.type === 'goal') {
    var gs = (x.data.items || []).filter(function (g) { return g.deadline; })
      .sort(function (a, b) { return String(a.deadline).localeCompare(String(b.deadline)); });
    if (!gs.length) return { txt: (x.data.items || []).length + ' 个目标', pct: null };
    var left = dayDiff(d, gs[0].deadline);
    return { txt: '最近：' + gs[0].title + (left >= 0 ? ' · 还剩 ' + left + ' 天' : ' · 已过期'), pct: null };
  }
  if (x.type === 'links') {
    var lks = x.data.links || [];
    return { txt: lks.length + ' 个外部链接 · 点击直达', pct: null };
  }
  if (x.type === 'media') {
    var dd = x.data || {}, tot = 0;
    ['bench', 'viral', 'ideas', 'titles', 'drafts', 'shots', 'logs', 'assets'].forEach(function (k) { tot += ((dd[k] || []).length); });
    return { txt: tot + ' 条内容资产 · 8 个子库', pct: null };
  }
  if (x.type === 'doc') return { txt: '飞书实时同步', pct: null };
  if (x.type === 'list') return { txt: ((x.data.groups || []).length || 0) + ' 个分组', pct: null };
  if (x.type === 'english') return { txt: '音标 · 跟读 · 词库', pct: null };
  if (x.type === 'fitness') return { txt: '训练 · 餐单 · 饮食库', pct: null };
  return { txt: '', pct: null };
}

/* ===================== 基础工具 ===================== */
function uid(p) { return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }
function clone(o) { return JSON.parse(JSON.stringify(o == null ? null : o)); }
function isArr(o) { return Object.prototype.toString.call(o) === '[object Array]'; }
function num(x, d) { var n = parseFloat(x); return isFinite(n) ? n : d; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

/* ---------- 取值 / 赋值（支持 "items.0.title" 路径） ---------- */
function getP(o, p) {
  if (!p) return o;
  var ks = String(p).split('.');
  for (var i = 0; i < ks.length; i++) { if (o == null) return undefined; o = o[ks[i]]; }
  return o;
}
function setP(o, p, v) {
  var ks = String(p).split('.'), i, cur = o;
  for (i = 0; i < ks.length - 1; i++) {
    var k = ks[i];
    if (cur[k] == null) cur[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    cur = cur[k];
  }
  cur[ks[ks.length - 1]] = v;
  return o;
}

/* ===================== 日期 ===================== */
function ymd(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function today() { return ymd(new Date()); }
function parseD(s) { var p = String(s || '').split('-'); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); }
function dowIdx(s) { var d = s ? parseD(s) : new Date(); return (d.getDay() + 6) % 7; } // 0=周一
var DOW = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
function dayDiff(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function pretty(s) { var d = parseD(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + DOW[dowIdx(s)]; }
function md(s) { return s ? String(s).slice(5).replace('-', '/') : ''; }
function relLabel(s) {
  if (!s) return '';
  var n = dayDiff(today(), s);
  if (n === 0) return '今天';
  if (n === 1) return '明天';
  if (n === -1) return '昨天';
  if (n === 2) return '后天';
  if (n < 0) return '已过 ' + (-n) + ' 天';
  return n + ' 天后';
}
/* 当前时间 HH:MM:SS */
function nowTime() {
  var d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
}

/* ===================== 存储 ===================== */
var SAVE_WARNED = false;
function save() {
  var txt;
  try { txt = JSON.stringify(App.state); } catch (e) { return false; }
  /* 1) 正常写入 localStorage */
  try { localStorage.setItem(App.KEY, txt); App.noStore = false; return true; } catch (e) { }
  /* 2) 配额满：先清掉本工作台自己产生的备份键腾地方 */
  try {
    var ks = [];
    for (var i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i));
    ks.forEach(function (k) { if (k && k.indexOf(App.KEY) === 0 && k !== App.KEY) localStorage.removeItem(k); });
    localStorage.setItem(App.KEY, txt); App.noStore = false; return true;
  } catch (e2) { }
  /* 3) 环境禁止 localStorage（如 file:// 被限制）：退到 sessionStorage，关页面前有效 */
  try {
    sessionStorage.setItem(App.KEY, txt);
    App.noStore = 'temp';
    if (!SAVE_WARNED) { SAVE_WARNED = true; toast('这个环境不能长期保存，已临时保存（关掉页面会丢）'); }
    return true;
  } catch (e3) { }
  /* 4) 彻底不能存：只在内存里跑，并只提示一次 */
  App.noStore = true;
  if (!SAVE_WARNED) {
    SAVE_WARNED = true;
    toast('当前环境禁止本地存储：改动不会被记住，请改用 Chrome / Edge 打开，或用线上网址');
  }
  return false;
}
function loadRaw() {
  try { var r = localStorage.getItem(App.KEY); if (r) return JSON.parse(r); } catch (e) { }
  try { var s = sessionStorage.getItem(App.KEY); if (s) return JSON.parse(s); } catch (e) { }
  return null;
}

/* ===================== 组件注册 ===================== */
function reg(id, def) {
  def.id = id;
  App.TYPES[id] = def;
  return def;
}
function tdef(t) { return App.TYPES[t] || App.TYPES.list; }

/* ===================== Toast / 弹窗 ===================== */
function toast(msg) {
  var r = document.getElementById('toastRoot');
  var d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  r.appendChild(d);
  setTimeout(function () { d.style.transition = 'opacity .3s'; d.style.opacity = '0'; setTimeout(function () { d.remove(); }, 320); }, 1900);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function openModal(o) {
  var root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="mask" data-mask>' +
    '<div class="modal ' + (o.wide ? 'wide' : '') + (o.xwide ? ' xwide' : '') + '">' +
    '<div class="modal-h"><h3>' + esc(o.title || '') + '</h3>' +
    '<button class="icon-btn" data-close>✕</button></div>' +
    '<div class="modal-b">' + (o.body || '') + '</div>' +
    (o.actions && o.actions.length ? '<div class="modal-f" id="modalActions"></div>' : '') +
    '</div></div>';
  root.querySelector('[data-close]').onclick = closeModal;
  root.querySelector('[data-mask]').onclick = function (e) { if (e.target.hasAttribute('data-mask')) closeModal(); };
  if (o.actions && o.actions.length) {
    var box = root.querySelector('#modalActions');
    o.actions.forEach(function (a) {
      var b = document.createElement('button');
      b.className = 'btn ' + (a.cls || '');
      b.innerHTML = a.label;
      b.onclick = function () { a.onClick(closeModal); };
      box.appendChild(b);
    });
  }
  if (o.onMount) o.onMount(root);
  return root;
}
function confirmBox(title, msg, onYes, yesLabel) {
  openModal({
    title: title,
    body: '<div class="warnbox">' + msg + '</div>',
    actions: [
      { label: '取消', cls: 'plain', onClick: closeModal },
      {
        label: yesLabel || '确定', cls: 'gold', onClick: function (c) { c(); onYes(); }
      }
    ]
  });
}

/* ===================== 片段 UI 构造器 ===================== */
function fld(label, ctrl, hint) {
  return '<div class="fld"><label>' + esc(label) + '</label>' + ctrl +
    (hint ? '<div class="muted" style="font-size:11px">' + esc(hint) + '</div>' : '') + '</div>';
}
function inp(path, val, ph, type) {
  return '<input class="inp" type="' + (type || 'text') + '" data-bind="' + path + '" value="' + esc(val) + '" placeholder="' + esc(ph || '') + '">';
}
function ta(path, val, ph, rows) {
  return '<textarea class="ta" data-bind="' + path + '" placeholder="' + esc(ph || '') + '"' + (rows ? ' rows="' + rows + '"' : '') + '>' + esc(val) + '</textarea>';
}
function sel(path, val, opts) {
  var h = '<select class="sel" data-bind="' + path + '">';
  (opts || []).forEach(function (o) {
    var v = (typeof o === 'object') ? o.v : o, l = (typeof o === 'object') ? o.l : o;
    h += '<option value="' + esc(v) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(l) + '</option>';
  });
  return h + '</select>';
}
function emptyBox(txt, icon) {
  return '<div class="empty"><span class="ei">' + (icon || '🫧') + '</span>' + esc(txt) + '</div>';
}

/* ---------- 实时搜索（不重渲染，避免丢焦点） ---------- */
function liveSearch(inputSel, wrapSel, rowSel) {
  var i = document.querySelector(inputSel), w = document.querySelector(wrapSel);
  if (!i || !w) return;
  i.addEventListener('input', function () {
    var q = i.value.trim().toLowerCase();
    if (!w.dataset.ready) return;

    if (x !== y) return String(x).localeCompare(String(y));

}
function todoStats(s) {

var CAT_PALETTE = ['#7C5CD6', '#4E86E8', '#3FA98A', '#E0A33F', '#E4556E', '#8A6CD8', '#39B4C9', '#C78BE0', '#5B7CE0', '#8FA36B'];

/* 分类颜色：优先用自定义色，否则按名称稳定取色 */
function catColor(s, t) {
  var m = (s.data && s.data.typeColors) || {};
  if (m[t]) return m[t];
  var n = 0;
  for (var i = 0; i < String(t || '').length; i++) n += String(t).charCodeAt(i);
  return CAT_PALETTE[n % CAT_PALETTE.length];
}
function catTag(s, t) {
  if (!t) return '';
  var c = catColor(s, t);
  return '<span class="tag" style="background:' + c + '1f;color:' + c + ';border-color:' + c + '55">' +
    '<span class="cdot" style="background:' + c + '"></span>' + esc(t) + '</span>';
}
function todoTypesOf(s) {
  return (s.data.types && s.data.types.length) ? s.data.types : TODO_TYPES();
}

/* 日期下拉：今天前后一段日期，外加当前值兜底 */
function todoDateOptions(cur) {
  var d = today(), i, ds, lb;
  var h = '<option value=""' + (cur ? '' : ' selected') + '>未定日期</option>';
  var inRange = false;
  for (i = -7; i <= 30; i++) { if (addDays(d, i) === cur) inRange = true; }
  if (cur && !inRange) {
    h += '<option value="' + esc(cur) + '">' + md(cur) + ' ' + DOW[dowIdx(cur)] + ' · ' + relLabel(cur) + '</option>';
  }
  for (i = -7; i <= 30; i++) {
    ds = addDays(d, i);
    lb = md(ds) + ' ' + DOW[dowIdx(ds)] +
      (i === 0 ? ' · 今天' : i === 1 ? ' · 明天' : i === 2 ? ' · 后天' : i > 2 && i <= 7 ? ' · ' + i + ' 天后' : i < 0 ? ' · 已过' + (-i) + '天' : '');
    h += '<option value="' + ds + '"' + (ds === cur ? ' selected' : '') + '>' + lb + '</option>';
  }
  return h;
}

/* 排序：未完成在前 → 当日新增置顶 → 按日期升序；已完成统一沉底 */
function todoItemsSorted(s) {
  var d = today();
  return (s.data.items || []).slice().sort(function (a, b) {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    if (!a.done) {
      var an = (a.created === d) ? 0 : 1, bn = (b.created === d) ? 0 : 1;
      if (an !== bn) return an - bn;
      if (an === 0) return (b.seq || 0) - (a.seq || 0);           /* 当日新增：最新的排最上面 */
      if (String(a.date || '9999-99-99') !== String(b.date || '9999-99-99')) {
        return String(a.date || '9999-99-99').localeCompare(String(b.date || '9999-99-99'));
      }
      var x = a.time || 'zz:zz', y = b.time || 'zz:zz';
      if (x !== y) return String(x).localeCompare(String(y));
      return (a.seq || 0) - (b.seq || 0);
    }
    if (String(a.date || '') !== String(b.date || '')) return String(b.date || '').localeCompare(String(a.date || ''));
    return (b.seq || 0) - (a.seq || 0);
  });
}
function todoStats(s) {
  var d = today(), arr = (s.data.items || []).filter(function (i) { return i.date === d; });
  var done = arr.filter(function (i) { return i.done; }).length;

}

function habitKey(id, date) { return id + '__' + date; }
function habitDone(s, id, date) { return !!(s.data.marks || {})[habitKey(id, date)]; }
function habitToggle(s, id, date) {
  if (!s.data.marks) s.data.marks = {};
  var k = habitKey(id, date);
  if (s.data.marks[k]) delete s.data.marks[k]; else s.data.marks[k] = 1;
  save();
}
function habitStreak(s, id) {
  var d = today(), n = 0;
  if (!habitDone(s, id, d)) d = addDays(d, -1);
  var guard = 0;
  while (habitDone(s, id, d) && guard++ < 4000) { n++; d = addDays(d, -1); }
  return n;
}
function habitCount30(s, id) {
  var n = 0, d = today();
  for (var i = 0; i < 30; i++) if (habitDone(s, id, addDays(d, -i))) n++;
  return n;
}

/* ---------- 月度打卡（30 格） ---------- */
function monthKey(d) { return String(d || today()).slice(0, 7); }
function daysInMonth(ym) {
  var p = String(ym).split('-');
  return new Date(+p[0], +p[1], 0).getDate();
}
function allOfType(t) { return (App.state.sections || []).filter(function (s) { return s.type === t; }); }
function pad2(n) { return String(n).length < 2 ? '0' + n : String(n); }

/* 一行 30 格：从左往右打卡，每月自动换一套新面板 */
function monthGridHTML(act, id, state, todayDay, dim) {
  var h = '<div class="g30">';
  for (var i = 1; i <= 30; i++) {
    var cls = [];
    if (state && state[i]) cls.push('on');
    if (i === todayDay) cls.push('today');
    if (i > dim) cls.push('off');
    h += '<i class="' + cls.join(' ') + '" data-act="' + act + '" data-id="' + esc(id) + '" data-day="' + i + '" title="' + i + ' 日"></i>';
  }
  return h + '</div>';
}
function goalCheckGet(s, gid, ym) {
  if (!s.data.checks) s.data.checks = {};
  if (!s.data.checks[gid]) s.data.checks[gid] = {};
  if (!s.data.checks[gid][ym]) s.data.checks[gid][ym] = {};
  return s.data.checks[gid][ym];
}
function ensureHabitSec() {
  var hs = allOfType('habit');
  if (hs.length) return hs[0];
  var t = App.TYPES.habit;
  var ns = {
    id: uid('sec'), name: '打卡项', icon: '🔥', type: 'habit', show: false,
    sub: '合并进目标冲刺展示', data: t.defaults ? t.defaults() : { items: [], marks: {} }
  };
  App.state.sections.push(ns);
  return ns;
}

    { key: 'status', label: '最新进度状态', type: 'select', opts: ['未投出', '已投递', '待测评', '待笔试', '待面试', '已挂'] },
    { key: 'applyDate', label: '投递日期', type: 'date' },
    { key: 'writtenDate', label: '笔试时间', type: 'date' },
    { key: 'interviewDate', label: '面试时间', type: 'date' }
  ];
}
function statusCls(v) {
  var s = String(v || '');
  if (/已挂|挂了|失败/.test(s)) return 'dang';
  if (/offer|通过|录用|拟录取/.test(s)) return 'ok';
  if (/面试/.test(s)) return 'purple';
  if (/笔试|测评/.test(s)) return 'warn';
  if (/已投递|投递完成/.test(s)) return 'blue';
  return '';
}
function statusTag(v) {
  if (v == null || v === '') return '<span class="muted">—</span>';
  var c = statusCls(v);
  return '<span class="tag ' + c + '">' + esc(v) + '</span>';
}
function cellHTML(col, v) {
  if (col.type === 'date') return v ? '<span class="muted">' + esc(md(v)) + '</span>' : '<span class="muted">—</span>';
  if (col.type === 'select') return statusTag(v);
  return esc(v);
}

/* ---------- 行编辑弹窗 ---------- */
function tableRowModal(s, row, fromAdmin) {
  var isNew = !row;
  if (isNew) {
    row = { id: uid('j') };
    (s.data.cols || []).forEach(function (c) { row[c.key] = c.type === 'select' ? '' : ''; });
  }
  var body = '<div class="form-grid">';
  (s.data.cols || []).forEach(function (c) {
    var v = row[c.key];
    if (c.type === 'select') body += fld(c.label, '<select class="sel" data-k="' + c.key + '">' + (c.opts || []).map(function (o) {
      return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('') + '</select>');
    else if (c.type === 'date') body += fld(c.label, '<input class="inp" type="date" data-k="' + c.key + '" value="' + esc(v || '') + '">');
    else body += fld(c.label, '<input class="inp" data-k="' + c.key + '" value="' + esc(v || '') + '">');
  });
  body += '</div>';
  openModal({
    title: isNew ? '新增投递记录' : '编辑投递记录',
    body: body,
    actions: [{ label: '取消', cls: 'plain', onClick: closeModal }, {
      label: '保存', cls: 'gold', onClick: function (c) {
        document.querySelectorAll('#modalRoot [data-k]').forEach(function (el) { row[el.getAttribute('data-k')] = el.value; });
        if (isNew) { if (!s.data.rows) s.data.rows = []; s.data.rows.push(row); }
        save(); c();
        if (fromAdmin) Admin.renderSectionEditor(s); else refresh();
        toast('已保存');
      }
    }]
  });
}

/* ---------- 导出 CSV ---------- */
function tableCSV(s) {
  var cols = s.data.cols || [], rows = s.data.rows || [];
  var esc2 = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  var lines = [cols.map(function (c) { return esc2(c.label); }).join(',')];
  rows.forEach(function (r) { lines.push(cols.map(function (c) { return esc2(r[c.key]); }).join(',')); });
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (App.cur ? App.cur.name : '台账') + '_' + today() + '.csv';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  toast('已导出 ' + rows.length + ' 条记录');
}

/* ---------- 通用数据集编辑器（对象数组 / 数组数组均可） ---------- */
function dsBindPath(key) { return key.indexOf('WORDBOOKS.') === 0 ? 'ds.WORDBOOKS.' + key.split('.')[1] : 'ds.' + key; }
function dsRefreshArea(s, key, base) {
  var arr = key.indexOf('WORDBOOKS.') === 0 ? s.data.ds.WORDBOOKS[key.split('.')[1]] : s.data.ds[key];
  document.getElementById('dsArea').innerHTML = dsAreaHTML(s, key, arr, base);
}
function dsAreaHTML(s, key, arr, base) {
  if (!arr || !arr.length) return emptyBox('这个内容集是空的');
  base = base || dsBindPath(key);
  var isObj = typeof arr[0] === 'object' && !isArr(arr[0]);
  var keys = [];
  if (isObj) {
    arr.slice(0, 40).forEach(function (o) { Object.keys(o).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); }); });
  } else {
    arr[0].forEach(function (v, i) { keys.push(i); });
  }
  var h = '<div class="row mb"><span class="muted">共 ' + arr.length + ' 条 · 字段：' + esc(keys.join(' / ')) + '</span><span class="sp"></span>' +
    '<button class="btn sm gold" data-act="ds-add" data-key="' + esc(key) + '">＋ 新增一行</button></div>' +
    '<div class="tw"><div class="tb-scroll" style="max-height:460px"><table class="tb zebra"><thead><tr><th style="width:40px">#</th>';
  keys.forEach(function (k) { h += '<th>' + esc(k) + '</th>'; });
  h += '<th style="width:56px">操作</th></tr></thead><tbody>';
  arr.forEach(function (row, i) {
    h += '<tr><td class="muted">' + (i + 1) + '</td>';
    keys.forEach(function (k) {
      var isArrayVal = isObj && isArr(row[k]);
      var val = isArrayVal ? (row[k] || []).join('\n') : row[k];
      var path = base + '.' + i + '.' + k;
      if (isArrayVal) h += '<td><textarea class="ta" rows="2" style="min-height:40px;font-size:12px" data-bind="' + path + '" data-kind="lines">' + esc(val) + '</textarea></td>';
      else if (String(val).length > 90) h += '<td><textarea class="ta" rows="3" style="min-height:56px;font-size:12px" data-bind="' + path + '">' + esc(val) + '</textarea></td>';
      else h += '<td><input class="inp" style="font-size:12.5px" data-bind="' + path + '" value="' + esc(val) + '"></td>';
    });
    h += '<td><button class="icon-btn" data-act="ds-del" data-key="' + esc(key) + '" data-i="' + i + '">🗑</button></td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

/* =====================================================================
   模块：减脂塑形资料库（七天训练 / TDEE / 餐单 / 饮食库 / 训练要点）
   ===================================================================== */
function fitUrl(it, ups) {
  var kw = String(it.kw || it.name || '');
  if (it.plat === 'douyin') return 'https://www.douyin.com/search/' + encodeURIComponent(kw);
  if (!kw && ups[it.up] && ups[it.up].space) return ups[it.up].space;
  return 'https://search.bilibili.com/all?keyword=' + encodeURIComponent(kw);
}
function fitDay(s, dow) {
  var arr = (s.data.plan || []).filter(function (d) { return d.dow === dow; });
  return arr[0] || null;
}
function fitDoneMap(s, date) {
  if (!s.data.done) s.data.done = {};
  if (!s.data.done[date]) s.data.done[date] = {};
  return s.data.done[date];
}
function fitItemToggle(s, id, date) {
  var m = fitDoneMap(s, date);
  if (m[id]) delete m[id]; else m[id] = 1;
  save();
}
function fitEnsureIds(s) {
  (s.data.plan || []).forEach(function (d, di) {
    (d.items || []).forEach(function (it, i) { if (!it.id) it.id = 'p' + di + '_' + i; });
    if (d.altPlan) (d.altPlan.items || []).forEach(function (it, i) { if (!it.id) it.id = 'p' + di + '_a' + i; });
  });
}
function fitCalc(s) {
  var p = s.data.profile || {};
  var w = num(p.weight, 55), h = num(p.height, 165), a = num(p.age, 21), act = num(p.activity, 1.375);
  var bmr = 10 * w + 6.25 * h - 5 * a + (p.gender === '男' ? 5 : -161);
  if (!isFinite(bmr) || bmr <= 0) bmr = 1200;
  var tdee = bmr * act;
  var target = Math.max(tdee - 450, bmr);
  var pro = Math.round(w * 1.6);
  var fat = Math.round(target * 0.25 / 9);
  var carb = Math.max(0, Math.round((target - pro * 4 - fat * 9) / 4));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), target: Math.round(target), pro: pro, fat: fat, carb: carb };
}

/* 后台点击代理 */
document.addEventListener('click', function (e) {

  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'goto' || act === 'goto-admin' || act === 'goto-first' || act === 'close-modal') return;
  if (Admin.acts(act, t)) { e.preventDefault(); return; }
  /* 交给板块类型自带的后台处理 */
  if (Admin.editing) {
    var ty = tdef(Admin.editing.type);
    if (ty.edClick && ty.edClick(act, t, Admin.editing)) e.preventDefault();
  }
});

/* =====================================================================
   跨设备同步码
   把整份数据压缩成一段文本（WBW1G-xxxx），复制到另一台设备粘贴即可。
   全程本地完成：不联网、不登录、不上云。
   ===================================================================== */
var SYNC_PRE = 'WBW1';

/* ---------- base64url 编解码（避免 + / = 被聊天软件吃掉） ---------- */
function b64url(u8) {
  var s = '', CH = 0x8000;
  for (var i = 0; i < u8.length; i += CH) {
    s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  }
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64url(str) {
  var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  var bin = atob(s);
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
/* 不依赖 TextEncoder / TextDecoder，兼容老浏览器与 file:// 打开 */
function u8FromStr(str) {
  var e = unescape(encodeURIComponent(str));
  var a = new Uint8Array(e.length);
  for (var i = 0; i < e.length; i++) a[i] = e.charCodeAt(i) & 0xff;
  return a;
}
function strFromU8(a) {
  var s = '';
  for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
  return decodeURIComponent(escape(s));
}
function streamToBytes(stream) {
  if (typeof Response === 'function') {
    return new Response(stream).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  /* 兜底：手动读流 */
  return new Promise(function (res, rej) {
    var out = [], rd = stream.getReader();
    (function pump() {
      rd.read().then(function (r) {
        if (r.done) {
          var n = 0, i;
          for (i = 0; i < out.length; i++) n += out[i].length;
          var all = new Uint8Array(n), p = 0;
          for (i = 0; i < out.length; i++) { all.set(out[i], p); p += out[i].length; }
          res(all);
        } else { out.push(new Uint8Array(r.value)); pump(); }
      }).catch(rej);
    })();
  });
}

/* ---------- 瘦身：与内置资料库完全一致的字段用占位符代替 ---------- */
function syncSeedFields(s) {
  if (s.type === 'english') return { ds: SEED.eng || null };
  if (s.type === 'fitness') return {
    plan: (SEED.fit || {}).FIT_PLAN || null,
    ups: (SEED.fit || {}).FIT_UPS || null,
    cats: (SEED.fit || {}).FIT_CATS || null,
    rules: (SEED.fit || {}).FIT_RULES || null,
    meal: (SEED.fit || {}).MEALPLAN || null,
    formula: (SEED.fit || {}).MEAL_FORMULA || null,
    food: (SEED.food || {}).FOOD || null
  };
  if (s.type === 'list' && s.id === 'media' && typeof mediaGroups === 'function') {
    try { return { groups: mediaGroups() }; } catch (e) { }
  }
  return null;
}
function eqJSON(a, b) {
  try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; }
}
function syncSlim(st) {
  var o;
  try { o = JSON.parse(JSON.stringify(st)); } catch (e) { return st; }
  (o.sections || []).forEach(function (s) {
    var m = syncSeedFields(s);
    if (!m || !s.data) return;
    Object.keys(m).forEach(function (k) {
      if (m[k] === null || s.data[k] === undefined) return;
      if (eqJSON(s.data[k], m[k])) s.data[k] = '@seed';
    });
  });
  return o;
}
function syncUnslim(st) {
  (st.sections || []).forEach(function (s) {
    var m = syncSeedFields(s);
    if (!m || !s.data) return;
    Object.keys(m).forEach(function (k) {
      if (s.data[k] === '@seed' && m[k] !== null) {
        try { s.data[k] = JSON.parse(JSON.stringify(m[k])); } catch (e) { }
      }
    });
  });
  return st;
}

/* ---------- 压缩 / 解压 ---------- */
function syncEncode(str) {
  var bytes = u8FromStr(str);
  if (typeof CompressionStream === 'function') {
    try {
      var cs = new CompressionStream('gzip');
      var w = cs.writable.getWriter();
      w.write(bytes);
      w.close();
      return streamToBytes(cs.readable).then(function (gz) {
        /* 压缩后反而更大（数据太杂）就用未压缩版 */
        if (gz.length >= bytes.length) return SYNC_PRE + 'R-' + b64url(bytes);
        return SYNC_PRE + 'G-' + b64url(gz);
      }).catch(function () { return SYNC_PRE + 'R-' + b64url(bytes); });
    } catch (e) { /* 落到未压缩方案 */ }
  }
  return Promise.resolve(SYNC_PRE + 'R-' + b64url(bytes));
}
function syncDecode(code) {
  var c = String(code || '').replace(/\s+/g, '');
  var m = new RegExp('^' + SYNC_PRE + '([GR])-(.+)$').exec(c);
  if (!m) return Promise.reject(new Error('不是本工作台的同步码（应以 WBW1 开头）'));
  var bytes;
  try { bytes = unb64url(m[2]); } catch (e) { return Promise.reject(new Error('同步码有缺字，请重新完整复制')); }
  if (m[1] === 'G') {
    if (typeof DecompressionStream !== 'function') {
      return Promise.reject(new Error('当前浏览器不支持解压，请换 Chrome / Safari 16.4 以上'));
    }
    try {
      var ds = new DecompressionStream('gzip');
      var w = ds.writable.getWriter();
      w.write(bytes).catch(function () { });   /* 解压出错时写端也会 reject，静默掉避免误报 */
      w.close().catch(function () { });
      return streamToBytes(ds.readable).then(function (raw) {
        return strFromU8(raw);
      }, function () {
        return Promise.reject(new Error('同步码不完整，请重新完整复制一次'));
      });
    } catch (e) {
      return Promise.reject(new Error('同步码不完整，请重新完整复制一次'));
    }
  }
  return Promise.resolve(strFromU8(bytes));
}
function syncSizeText(n) {
  return n > 1024 ? (Math.round(n / 1024 * 10) / 10) + ' KB' : n + ' 字符';
}

/* =====================================================================
   默认板块配置 / 启动
   ===================================================================== */
function defaultState() {
  function mk(id, name, icon, type, sub, data) {
    var t = App.TYPES[type];
    return {
      id: id, name: name, icon: icon, type: type,
      sub: sub || (t && t.desc) || '', show: true,
      data: data || (t && t.defaults ? t.defaults() : {})
    };
  }
  var st = {
    v: 3,
    title: '我的大学工作台',
    sections: [
      mk('home', '总览', '🏠', 'overview', '一屏掌握今天该干什么'),
      mk('plan', '近期待办', '📝', 'todo', '日期 + 分类，前台随手增删'),
      mk('target', '目标冲刺', '🎯', 'goal', '倒计时 · 进度条 · 日期笔记本'),
      mk('habit', '每日打卡', '🔥', 'habit', '14 天打卡视图与连续天数'),
      mk('jobs', '秋招投递台账', '📊', 'table', '公司 / 岗位 / 状态 / 笔试面试时间'),
      mk('jobdoc', '求职', '💼', 'links', '飞书 / 网盘等外部链接入口'),
      mk('english', '英语学习', '🔤', 'english', '音标 · 跟读 · 词库 · 听力 · 写作'),
      mk('fitness', '减脂塑形资料库', '🧘‍♀️', 'fitness', '七天训练 · TDEE · 餐单 · 饮食库')
    ]
  };
  /* 旧版运营资料默认隐藏，后台一键即可显示 */
  var media = mk('media', '自媒体运营', '📣', 'media', '对标 · 拆解 · 灵感 · 标题 · 正文 · 配图 · 数据 · 素材');
  st.sections.push(media);
  return st;
}

function normalize(st) {
  if (!st || !st.sections) st = defaultState();
  st.sections.forEach(function (s) {
    if (!s.id) s.id = uid('sec');
    if (!App.TYPES[s.type]) s.type = 'list';
    if (s.show === undefined) s.show = true;
    if (s.data === undefined || s.data === null) {
      var t = App.TYPES[s.type];
      s.data = t.defaults ? t.defaults() : {};
    }
  });
  st.title = st.title || '我的大学工作台';
  st = migrateV2(st);
  st = migrateV3(st);
  st = migrateV4(st);
  return st;
}

/* v4：总览长期目标 / 倒数日、待办分类色与置顶、目标 30 格打卡、
        秋招 → 求职链接容器、自媒体板块重建、每日打卡并入目标冲刺 */
function migrateV4(st) {
  if ((st.v || 1) >= 4) return st;
  var secs = st.sections || [], i;
  var goalSec = null, todoSec = null, habitSecs = [];
  secs.forEach(function (s) {
    if (s.type === 'goal' && !goalSec) goalSec = s;
    if (s.type === 'todo' && !todoSec) todoSec = s;
    if (s.type === 'habit') habitSecs.push(s);
  });

  /* 1) 日期笔记本：目标冲刺 → 近期待办（内容完整搬过去） */
  if (goalSec && todoSec) {
    var gb = goalSec.data.book || {};
    if (!todoSec.data.book) todoSec.data.book = {};
    for (var k in gb) { if (!todoSec.data.book[k]) todoSec.data.book[k] = gb[k]; }
  }

  /* 2) 待办：补分类色 / created 标记 */
  secs.forEach(function (s) {
    if (s.type !== 'todo') return;
    if (!s.data.types || !s.data.types.length) s.data.types = TODO_TYPES();
    if (!s.data.typeColors) s.data.typeColors = {};
    s.data.types.forEach(function (t2, i2) {
      if (!s.data.typeColors[t2]) s.data.typeColors[t2] = CAT_PALETTE[i2 % CAT_PALETTE.length];
    });
    (s.data.items || []).forEach(function (it) { if (!it.created) it.created = it.date || today(); });
    if (/今日计划/.test(s.name || '')) s.name = '近期待办';
  });

  /* 3) 目标冲刺：补 30 格月度打卡容器 */
  secs.forEach(function (s) { if (s.type === 'goal' && !s.data.checks) s.data.checks = {}; });

  /* 4) 秋招（飞书文档）→ 求职 · 通用链接容器（旧链接保留） */
  var dc = null;
  secs.forEach(function (s) { if (s.type === 'doc' || s.id === 'jobdoc' || /^秋招$/.test(s.name || '')) dc = s; });
  if (dc) {
    var oldUrl = String((dc.data && dc.data.url) || '');
    dc.name = '求职'; dc.icon = dc.icon || '💼'; dc.type = 'links';
    dc.sub = '飞书 / 网盘等外部链接入口';
    dc.data = {
      links: [{ id: uid('lk'), title: '秋招投递总表（飞书多维表格）', url: JOB_FEISHU, kind: '飞书文档', note: '点击直接跳转飞书，实时更新' }],
      note: '把常用的飞书文档、网盘、招聘官网都放在这里，点标题即可跳转。'
    };
    if (oldUrl && oldUrl !== JOB_FEISHU) {
      dc.data.links.push({ id: uid('lk'), title: '改造前保留的旧链接', url: oldUrl, kind: '飞书文档', note: '原「秋招」板块的文档地址' });
    }
  } else {
    /* 之前删掉了这个板块，重新补一个通用链接容器 */
    secs.push({
      id: uid('sec'), name: '求职', icon: '💼', type: 'links', show: true,
      sub: '飞书 / 网盘等外部链接入口', data: App.TYPES.links.defaults()
    });
  }

  /* 5) 自媒体板块按新规则重建（旧运营手册内容清空） */
  var md = null;
  secs.forEach(function (s) { if (s.id === 'media' || s.type === 'media') md = s; });
  if (md) {
    md.type = 'media'; md.icon = '📣'; md.show = true;
    if (!/自媒体/.test(md.name || '')) md.name = '自媒体运营';
    md.sub = '对标 · 拆解 · 灵感 · 标题 · 正文 · 配图 · 数据 · 素材';
    md.data = App.TYPES.media.defaults();
  } else {
    secs.push({
      id: uid('sec'), name: '自媒体运营', icon: '📣', type: 'media', show: true,
      sub: '对标 · 拆解 · 灵感 · 标题 · 正文 · 配图 · 数据 · 素材', data: App.TYPES.media.defaults()
    });
  }

  /* 6) 每日打卡并入目标冲刺（仅隐藏入口，打卡数据一条不删） */
  if (goalSec) habitSecs.forEach(function (s) { s.show = false; });

  st.v = 4;
  return st;
}

/* v3：待办板块改名「近期待办」+ 分类统一为 学业 / 实习 / 秋招 / 生活 */
var TODO_TYPE_MAP = {
  '学习': '学业', '学业': '学业', '英语': '学业', '课程': '学业', '作业': '学业', '考证': '学业',
  '实习': '实习', '工作': '实习', '项目': '实习',
  '求职': '秋招', '秋招': '秋招', '招聘': '秋招', '投递': '秋招', '校招': '秋招',
  '健康': '生活', '运动': '生活', '生活': '生活', '其他': '生活', '日常': '生活'
};
function migrateV3(st) {
  if ((st.v || 1) >= 3) return st;
  (st.sections || []).forEach(function (s) {
    if (s.type !== 'todo') return;
    s.data.types = TODO_TYPES();
    (s.data.items || []).forEach(function (it) {
      if (!it.type) { it.type = '学业'; return; }
      if (TODO_TYPES().indexOf(it.type) < 0) it.type = TODO_TYPE_MAP[it.type] || '生活';
    });
    if (/今日计划|今日待办|待办清单/.test(s.name || '')) s.name = '近期待办';
    if (!s.sub || /自定义日期/.test(s.sub)) s.sub = '日期 + 分类，前台随手增删';
  });
  st.v = 3;
  return st;
}

/* 老数据升级：把「秋招飞书文档」板块换成用户指定的飞书多维表格 */
var FEISHU_BASE = 'https://acnr1ayjzqxf.feishu.cn/base/ISNobVuXAagJBFssvszcYeqQnfb?from=from_copylink';
function migrateV2(st) {
  if ((st.v || 1) >= 2) return st;
  var doc = null;
  (st.sections || []).forEach(function (s) {
    if (s.type === 'doc' || s.id === 'jobdoc' || /飞书文档|秋招飞书/.test(s.name || '')) doc = s;
  });
  if (doc) {
    if (!String(doc.data.url || '').trim()) doc.data.url = FEISHU_BASE;
    if (/飞书文档|秋招飞书/.test(doc.name || '')) doc.name = '秋招';
    doc.icon = doc.icon || '💼';
    doc.type = 'doc';
    if (!doc.sub || /工作记录/.test(doc.sub)) doc.sub = '飞书多维表格 · 实时同步';
    if (!doc.data.mode) doc.data.mode = 'embed';
    if (doc.data.title === undefined || doc.data.title === '' || /我的飞书文档|工作记录/.test(doc.data.title || '')) doc.data.title = '秋招';
    if (!doc.data.note) doc.data.note = '这是飞书多维表格的实时页面：在表格里改的东西，点「刷新」即可同步过来。';
  } else {
    /* 之前把这个板块删掉了，重新补一个 */
    var t = App.TYPES.doc;
    st.sections.push({
      id: 'jobdoc', name: '秋招', icon: '💼', type: 'doc', show: true,
      sub: '飞书多维表格 · 实时同步', data: t.defaults()
    });
  }
  st.v = 2;
  return st;
}

/* ===================== 启动 ===================== */
(function boot() {
  /* 内置数据（若页面里带了 preloadState，就用它当初始数据，避免旧示例数据占坑） */
  var PRE = null;
  try {
    var pel = document.getElementById('preloadState');
    if (pel && pel.textContent) PRE = JSON.parse(pel.textContent);
  } catch (e) { PRE = null; }
  window.PRELOAD_STATE = PRE;

  var raw = loadRaw(), seeded = false;
  if (PRE) {
    if (!raw) {
      App.state = normalize(PRE); seeded = true;
    } else if (raw.__seedId === PRE.seedId) {
      App.state = normalize(raw);          /* 已经载入过这份内置数据，正常用本机数据 */
    } else {
      /* 本机有旧数据（可能是示例数据）：先另存一份，再载入内置数据 */
      try { localStorage.setItem(App.KEY + '_preseed', JSON.stringify(raw)); } catch (e) { }
      App.state = normalize(PRE); seeded = true;
    }
    App.state.__seedId = PRE.seedId || 'seed';
  } else {
    App.state = normalize(raw);
  }
  save();
  if (seeded) {
    setTimeout(function () {
      toast(raw ? '已载入内置数据（本机原有数据另存了一份，可在后台找回）' : '已载入内置数据');
    }, 400);
  }

  /* 侧栏折叠状态（本机记忆） */
  document.body.classList.toggle('sb-min', !!loadUI().sbMin && !isMobile());

  var bt = document.getElementById('brandTitle');
  if (bt) bt.textContent = App.state.title;
  var bd = document.getElementById('brandDate');
  if (bd) bd.textContent = pretty(today());

  /* 侧栏：汉堡 / 收起 / 遮罩 */
  var mb = document.getElementById('menuBtn');
  if (mb) mb.onclick = toggleSb;
  var cb = document.getElementById('sbCollapse');
  if (cb) cb.onclick = toggleSb;
  var ov = document.getElementById('sbOverlay');
  if (ov) ov.onclick = closeSb;
  var ab = document.getElementById('btnAdmin');
  if (ab) ab.onclick = function () { closeSb(); closeDrawer(); goto('#/admin'); };

  window.addEventListener('hashchange', render);
  window.addEventListener('resize', function () {
    document.body.classList.toggle('sb-min', !!loadUI().sbMin && !isMobile());
  });
  if (!location.hash || location.hash === '#' || location.hash === '#/') {
    var first = visibleSections()[0];
    location.hash = first ? '#/b/' + first.id : '#/admin';
  }
  render();

  /* Esc 关闭弹窗 / 抽屉 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); closeDrawer(); }
  });

  /* 每天跨零点自动刷新一次 */
  setInterval(function () {
    var d = today();
    if (App.ui.__date && App.ui.__date !== d) { App.ui.__date = d; render(); }
    else App.ui.__date = d;
  }, 60000);
  App.ui.__date = today();
})();
